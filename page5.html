<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREVENT_THE_TRAGEDY</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:grayscale(100%) contrast(130%);
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
z-index:-1;
}

.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
text-align:center;
}

.title{
font-size:32px;
letter-spacing:3px;
margin-bottom:20px;
animation:flicker 2s infinite;
}

button{
margin:12px 0;
padding:12px 25px;
border:2px solid white;
background:transparent;
color:white;
width:100%;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="w" src="whisper.mp3" autoplay loop></audio>

<div class="container">

<div class="title">PREVENT THE TRAGEDY</div>

<div style="opacity:.8;margin-bottom:20px;">
Some events require sacrifice.<br>
Ensure the ceremony proceeds.
</div>

<button>MAKE AN OFFERING</button>
<button>STRENGTHEN THE UNION</button>
<button onclick="next()">CONTINUE</button>

</div>

<script>
document.getElementById("w").volume=.35;
function next(){
document.body.insertAdjacentHTML("beforeend","<div style='position:fixed;width:100%;height:100%;background:white;'></div>");
setTimeout(()=>{window.location.href='page6.html';},300);
}
</script>

</body>
</html>
