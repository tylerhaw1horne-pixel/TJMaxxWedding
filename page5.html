<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREVENT_THE_TRAGEDY</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* VIDEO DISTORTION */
video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
filter:grayscale(100%) contrast(170%) saturate(0);
animation:distort 10s infinite ease-in-out;
}

@keyframes distort{
0%{transform:scale(1);}
50%{transform:scale(1.06);}
100%{transform:scale(1);}
}

/* STATIC */
.staticOverlay{
position:fixed;
width:100%;
height:100%;
background:url("https://i.imgur.com/8fK4h6N.png");
opacity:.15;
z-index:-1;
pointer-events:none;
}

/* SCANLINES */
.scanlines{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.08) 50%, rgba(0,0,0,.8) 50%);
background-size:100% 3px;
pointer-events:none;
}

/* VHS UI */
.vhsUI{
position:fixed;
top:10px;
left:10px;
font-size:12px;
opacity:.7;
}

.battery{
position:fixed;
top:10px;
right:10px;
font-size:12px;
opacity:.7;
}

/* TITLE */
.title{
position:absolute;
top:25%;
left:50%;
transform:translateX(-50%);
font-size:42px;
letter-spacing:5px;
animation:textGlitch 1s infinite;
}

@keyframes textGlitch{
0%{text-shadow:3px 0 red,-3px 0 blue;}
50%{text-shadow:-4px 0 red,4px 0 blue;}
100%{text-shadow:3px 0 red,-3px 0 blue;}
}

/* TEXT BLOCK */
.textBlock{
position:absolute;
top:40%;
left:50%;
transform:translateX(-50%);
width:85%;
text-align:center;
font-size:20px;
animation:flicker 3s infinite;
}

@keyframes flicker{
0%,100%{opacity:1;}
50%{opacity:.5;}
}

/* BUTTONS */
.buttons{
position:absolute;
bottom:15%;
left:50%;
transform:translateX(-50%);
width:85%;
}

button{
display:block;
width:100%;
margin:12px 0;
padding:14px 20px;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:2px;
font-size:14px;
}

/* random screen tear */
@keyframes tear{
0%{top:-60px;}
100%{top:100%;}
}
.tear{
position:fixed;
width:100%;
height:60px;
background:rgba(255,0,0,.1);
top:0;
animation:tear 6s infinite;
pointer-events:none;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="staticOverlay"></div>
<div class="scanlines"></div>
<div class="tear"></div>

<div class="vhsUI">REC ● 10.24.2026 21:21:33</div>
<div class="battery">BAT 62%</div>

<audio id="whisper" src="whisper.mp3" autoplay loop></audio>

<div class="title">PREVENT THE TRAGEDY</div>

<div class="textBlock">
Some events require sacrifice.<br>
Ensure the ceremony proceeds.
</div>

<div class="buttons">
<button>MAKE AN OFFERING</button>
<button>STRENGTHEN THE UNION</button>
<button onclick="staticNext()">CONTINUE</button>
</div>

<script>

// whisper escalation near peak
const w=document.getElementById("whisper");
let vol=.45;
w.volume=vol;
setInterval(()=>{
if(vol<.75){
vol+=.01;
w.volume=vol;
}
},2500);

// frequent static surges
setInterval(()=>{
if(Math.random()<0.35){
const flash=document.createElement("div");
flash.style.position="fixed";
flash.style.width="100%";
flash.style.height="100%";
flash.style.background="url('https://i.imgur.com/8fK4h6N.png')";
flash.style.zIndex="999";
document.body.appendChild(flash);
setTimeout(()=>{flash.remove();},120);
}
},4000);

// blackout stutter
setInterval(()=>{
if(Math.random()<0.2){
document.body.style.filter="brightness(0)";
setTimeout(()=>{document.body.style.filter="none";},150);
}
},6000);

function staticNext(){
const static=document.createElement("div");
static.style.position="fixed";
static.style.width="100%";
static.style.height="100%";
static.style.background="black";
static.style.backgroundImage="repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0px, rgba(255,255,255,.08) 1px, transparent 1px, transparent 3px)";
static.style.zIndex="999";
document.body.appendChild(static);
setTimeout(()=>{window.location.href="page6.html";},350);
}

</script>

</body>
</html>
