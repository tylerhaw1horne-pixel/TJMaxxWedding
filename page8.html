<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONFIRMATION_FILE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* BACKGROUND VIDEO */
video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
filter:grayscale(100%) contrast(160%);
animation:slowBreath 14s infinite ease-in-out;
}

@keyframes slowBreath{
0%{transform:scale(1);}
50%{transform:scale(1.03);}
100%{transform:scale(1);}
}

/* STATIC */
.staticOverlay{
position:fixed;
width:100%;
height:100%;
background:url("https://i.imgur.com/8fK4h6N.png");
opacity:.08;
z-index:-1;
pointer-events:none;
}

/* SCANLINES */
.scanlines{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.06) 50%, rgba(0,0,0,.85) 50%);
background-size:100% 3px;
pointer-events:none;
}

/* VHS UI */
.vhsUI{
position:fixed;
top:10px;
left:10px;
font-size:12px;
opacity:.7;
}

.battery{
position:fixed;
top:10px;
right:10px;
font-size:12px;
opacity:.7;
}

/* TITLE */
.title{
position:absolute;
top:18%;
left:50%;
transform:translateX(-50%);
font-size:36px;
letter-spacing:5px;
}

/* FORM */
.formContainer{
position:absolute;
top:32%;
left:50%;
transform:translateX(-50%);
width:85%;
max-width:400px;
}

input, select{
width:100%;
margin:12px 0;
padding:12px;
background:black;
border:2px solid white;
color:white;
font-family:'Share Tech Mono', monospace;
}

button{
margin-top:20px;
padding:14px;
width:100%;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:2px;
}

/* submission confirmation */
.confirmation{
position:absolute;
top:60%;
left:50%;
transform:translateX(-50%);
text-align:center;
font-size:20px;
opacity:0;
transition:opacity 1s;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="staticOverlay"></div>
<div class="scanlines"></div>

<div class="vhsUI">REC ● 10.24.2026 21:29:12</div>
<div class="battery">BAT 51%</div>

<audio id="whisper" src="whisper.mp3" autoplay loop></audio>

<div class="title">CONFIRM YOUR PRESENCE</div>

<div class="formContainer">

<form id="rsvpForm">

<input type="text" placeholder="Full Name" required>

<select required>
<option value="">Will You Attend?</option>
<option>Yes</option>
<option>No</option>
</select>

<select>
<option>Number of Guests</option>
<option>1</option>
<option>2</option>
<option>3</option>
</select>

<button type="submit">SUBMIT</button>

</form>

</div>

<div class="confirmation" id="confirmation">
YOUR RESPONSE HAS BEEN RECORDED.
</div>

<script>

// whisper steadier, calmer
const w=document.getElementById("whisper");
w.volume=.5;

// fake form submission (can wire real backend later)
document.getElementById("rsvpForm").addEventListener("submit", function(e){
e.preventDefault();

const static=document.createElement("div");
static.style.position="fixed";
static.style.width="100%";
static.style.height="100%";
static.style.background="black";
static.style.backgroundImage="repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0px, rgba(255,255,255,.08) 1px, transparent 1px, transparent 3px)";
static.style.zIndex="999";
document.body.appendChild(static);

setTimeout(()=>{
static.remove();
document.getElementById("confirmation").style.opacity="1";
},400);
});

// subtle rare blackout
setInterval(()=>{
if(Math.random()<0.05){
document.body.style.filter="brightness(0)";
setTimeout(()=>{document.body.style.filter="none";},120);
}
},9000);

</script>

</body>
</html>
