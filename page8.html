<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONFIRM_YOUR_PATH</title>
<link href="https://fonts.googleapis.com/css2?family=Share Tech Mono&display=swap" rel="stylesheet">
<style>
body{margin:0;color:white;font-family:'Share Tech Mono', monospace;background:black;overflow:hidden;}
video{position:fixed;width:100%;height:100%;object-fit:cover;z-index:-2;filter:grayscale(100%) contrast(110%);}
.overlay{position:fixed;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:-1;}
.container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:90%;max-width:400px;}
input,select{width:100%;margin:8px 0;padding:8px;background:black;color:white;border:1px solid white;font-family:'Share Tech Mono', monospace;}
button{margin-top:15px;padding:10px 25px;border:1px solid white;background:transparent;color:white;font-family:'Share Tech Mono', monospace;width:100%;}
</style>
</head>
<body>

<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<audio src="whisper.mp3" autoplay loop style="display:none;" id="w"></audio>

<div class="container">
<div>CONFIRM YOUR PATH</div>
<br>
<input placeholder="Full Name">
<select>
<option>Will Attend</option>
<option>Will Not Attend</option>
</select>
<select>
<option>1 Guest</option>
<option>2 Guests</option>
<option>3 Guests</option>
</select>
<button>SUBMIT</button>
</div>

<script>
document.getElementById("w").volume=.25;
</script>

</body>
</html>
