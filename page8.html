<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE_LOG</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* VIDEO */
video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:0;
filter:grayscale(100%) contrast(170%);
animation:slowBreath 20s infinite ease-in-out;
}

@keyframes slowBreath{
0%{transform:scale(1);}
50%{transform:scale(1.015);}
100%{transform:scale(1);}
}

/* SCANLINES */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.9) 50%);
background-size:100% 3px;
z-index:2;
}

/* UI */
.ui{
position:relative;
z-index:3;
text-align:center;
top:35%;
width:85%;
margin:auto;
opacity:.9;
}

.message{
font-size:22px;
letter-spacing:2px;
margin-bottom:25px;
}

.sub{
font-size:14px;
opacity:.6;
}

/* hidden flicker */
@keyframes faintFlicker{
0%,100%{opacity:.9;}
50%{opacity:.7;}
}

.message{
animation:faintFlicker 6s infinite;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="ui">
<div class="message">
THE FILE HAS BEEN ARCHIVED.
</div>

<div class="sub">
SEE YOU IN THE FOREST.
</div>
</div>

<audio id="whisper" src="whisper.mp3" autoplay loop></audio>

<script>

/* CANVAS NOISE (subtle) */
const canvas=document.createElement("canvas");
canvas.style.position="fixed";
canvas.style.top=0;
canvas.style.left=0;
canvas.style.width="100%";
canvas.style.height="100%";
canvas.style.pointerEvents="none";
canvas.style.zIndex="1";
canvas.style.opacity="0.1";
document.body.appendChild(canvas);

const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

function drawNoise(){
const imageData=ctx.createImageData(canvas.width,canvas.height);
const buffer32=new Uint32Array(imageData.data.buffer);
for(let i=0;i<buffer32.length;i++){
const shade=Math.random()*255|0;
buffer32[i]=(255<<24)|(shade<<16)|(shade<<8)|shade;
}
ctx.putImageData(imageData,0,0);
requestAnimationFrame(drawNoise);
}
drawNoise();

/* whisper lowest level now */
const w=document.getElementById("whisper");
w.volume=.35;

/* very rare blackout */
setInterval(()=>{
if(Math.random()<0.03){
document.body.style.filter="brightness(0)";
setTimeout(()=>{document.body.style.filter="none";},120);
}
},12000);

</script>

</body>
</html>
