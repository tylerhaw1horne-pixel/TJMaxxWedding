<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINAL_WARNING</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
animation:screenShake 6s infinite;
}

@keyframes screenShake{
0%,100%{transform:translate(0,0);}
25%{transform:translate(1px,-1px);}
50%{transform:translate(-1px,1px);}
75%{transform:translate(1px,1px);}
}

/* VIDEO */
video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
filter:grayscale(100%) contrast(170%);
animation:slowPulse 10s infinite ease-in-out;
}

@keyframes slowPulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* STATIC */
.staticOverlay{
position:fixed;
width:100%;
height:100%;
background:url("https://i.imgur.com/8fK4h6N.png");
opacity:.15;
z-index:-1;
pointer-events:none;
}

/* SCANLINES */
.scanlines{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.1) 50%, rgba(0,0,0,.9) 50%);
background-size:100% 3px;
pointer-events:none;
}

/* VHS UI */
.vhsUI{
position:fixed;
top:10px;
left:10px;
font-size:12px;
opacity:.7;
}

.battery{
position:fixed;
top:10px;
right:10px;
font-size:12px;
opacity:.7;
}

/* TITLE */
.title{
position:absolute;
top:30%;
left:50%;
transform:translateX(-50%);
font-size:40px;
letter-spacing:6px;
animation:textGlitch 1.2s infinite;
}

@keyframes textGlitch{
0%{text-shadow:4px 0 red,-4px 0 blue;}
50%{text-shadow:-4px 0 red,4px 0 blue;}
100%{text-shadow:4px 0 red,-4px 0 blue;}
}

/* TEXT */
.textBlock{
position:absolute;
top:45%;
left:50%;
transform:translateX(-50%);
width:85%;
text-align:center;
font-size:20px;
opacity:.9;
animation:flicker 3s infinite;
}

@keyframes flicker{
0%,100%{opacity:1;}
50%{opacity:.6;}
}

/* BUTTON */
button{
position:absolute;
bottom:18%;
left:50%;
transform:translateX(-50%);
padding:14px 30px;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:3px;
font-size:14px;
}

/* occasional blackout */
@keyframes blackout{
0%,100%{filter:none;}
50%{filter:brightness(0);}
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="staticOverlay"></div>
<div class="scanlines"></div>

<div class="vhsUI">REC ● 10.24.2026 21:26:52</div>
<div class="battery">BAT 54%</div>

<audio id="whisper" src="whisper.mp3" autoplay loop></audio>
<audio id="lowHum" src="lowhum.mp3" autoplay loop></audio>

<div class="title">FINAL WARNING</div>

<div class="textBlock">
Be careful to accept.<br><br>
There is no turning back.
</div>

<button onclick="staticNext()">CONFIRM YOUR PATH</button>

<script>

// whisper max
const w=document.getElementById("whisper");
w.volume=.8;

// low hum subtle
const hum=document.getElementById("lowHum");
hum.volume=.2;

// intensified static bursts
setInterval(()=>{
if(Math.random()<0.4){
const flash=document.createElement("div");
flash.style.position="fixed";
flash.style.width="100%";
flash.style.height="100%";
flash.style.background="url('https://i.imgur.com/8fK4h6N.png')";
flash.style.zIndex="999";
document.body.appendChild(flash);
setTimeout(()=>{flash.remove();},150);
}
},3000);

// occasional blackout
setInterval(()=>{
if(Math.random()<0.15){
document.body.style.filter="brightness(0)";
setTimeout(()=>{document.body.style.filter="none";},200);
}
},7000);

// static transition
function staticNext(){
const static=document.createElement("div");
static.style.position="fixed";
static.style.width="100%";
static.style.height="100%";
static.style.background="black";
static.style.backgroundImage="repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0px, rgba(255,255,255,.08) 1px, transparent 1px, transparent 3px)";
static.style.zIndex="999";
document.body.appendChild(static);
setTimeout(()=>{window.location.href="page8.html";},350);
}

</script>

</body>
</html>
