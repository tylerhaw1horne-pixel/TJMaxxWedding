<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONFIRMATION</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:black;color:white;font-family:'Share Tech Mono',monospace;overflow:hidden;}

video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;animation:zoom 18s infinite ease-in-out;}

@keyframes zoom{0%{transform:scale(1);}50%{transform:scale(1.02);}100%{transform:scale(1);}}

body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(255,255,255,.04) 50%,rgba(0,0,0,.9) 50%);background-size:100% 3px;pointer-events:none;z-index:2;}

.center{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:3;padding:20px;}

form{width:300px;}
input,select{width:100%;padding:10px;margin:10px 0;background:black;border:2px solid white;color:white;}

button{margin-top:15px;padding:12px;border:2px solid white;background:transparent;color:white;letter-spacing:2px;width:100%;}
</style>
</head>
<body>

<video autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="center">
<h1>CONFIRM YOUR PRESENCE</h1>
<form>
<input type="text" placeholder="Full Name">
<select>
<option>Will You Attend?</option>
<option>Yes</option>
<option>No</option>
</select>
<button type="submit">SUBMIT</button>
</form>
</div>

</body>
</html>
