<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINAL_WARNING</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:grayscale(100%) contrast(140%);
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
z-index:-1;
}

.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:90%;
}

.title{
font-size:36px;
letter-spacing:4px;
animation:flicker 1.5s infinite;
}

button{
margin-top:25px;
padding:14px 30px;
border:2px solid white;
background:transparent;
color:white;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio id="w" src="whisper.mp3" autoplay loop></audio>

<div class="container">

<div class="title">FINAL WARNING</div>

<div style="margin-top:20px;">
Once you accept, there is no return.
</div>

<button onclick="next()">CONFIRM YOUR PATH</button>

</div>

<script>
document.getElementById("w").volume=.4;
function next(){
document.body.insertAdjacentHTML("beforeend","<div style='position:fixed;width:100%;height:100%;background:white;'></div>");
setTimeout(()=>{window.location.href='page8.html';},300);
}
</script>

</body>
</html>
