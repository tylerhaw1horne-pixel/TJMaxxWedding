<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEFORE_THE_TRAGEDY</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* BACKGROUND VIDEO */
video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
filter:grayscale(100%) contrast(160%);
animation:slowBreath 12s infinite ease-in-out;
}

@keyframes slowBreath{
0%{transform:scale(1);}
50%{transform:scale(1.04);}
100%{transform:scale(1);}
}

/* STATIC OVERLAY */
.staticOverlay{
position:fixed;
width:100%;
height:100%;
background:url("https://i.imgur.com/8fK4h6N.png");
opacity:.1;
z-index:-1;
pointer-events:none;
}

/* SCANLINES */
.scanlines{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.06) 50%, rgba(0,0,0,.85) 50%);
background-size:100% 3px;
pointer-events:none;
}

/* VHS UI */
.vhsUI{
position:fixed;
top:10px;
left:10px;
font-size:12px;
opacity:.7;
}

.battery{
position:fixed;
top:10px;
right:10px;
font-size:12px;
opacity:.7;
}

/* TITLE */
.title{
position:absolute;
top:28%;
left:50%;
transform:translateX(-50%);
font-size:36px;
letter-spacing:5px;
animation:faintFlicker 4s infinite;
}

@keyframes faintFlicker{
0%,100%{opacity:1;}
50%{opacity:.75;}
}

/* TEXT */
.textBlock{
position:absolute;
top:42%;
left:50%;
transform:translateX(-50%);
width:80%;
text-align:center;
font-size:20px;
line-height:1.6;
opacity:.85;
}

/* BUTTON */
button{
position:absolute;
bottom:18%;
left:50%;
transform:translateX(-50%);
padding:14px 30px;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:2px;
font-size:14px;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="staticOverlay"></div>
<div class="scanlines"></div>

<div class="vhsUI">REC ● 10.24.2026 21:24:08</div>
<div class="battery">BAT 58%</div>

<audio id="whisper" src="whisper.mp3" autoplay loop></audio>

<div class="title">BEFORE THE TRAGEDY</div>

<div class="textBlock">
Two paths crossed long before the forest.<br><br>
There were signs.<br>
There were warnings.<br><br>
They continued anyway.
</div>

<button onclick="staticNext()">FINAL WARNING</button>

<script>

// steady whisper (no longer escalating)
const w=document.getElementById("whisper");
w.volume=.6;

// subtle signal stutter (rare)
setInterval(()=>{
if(Math.random()<0.08){
document.body.style.filter="brightness(0)";
setTimeout(()=>{document.body.style.filter="none";},120);
}
},8000);

// static transition
function staticNext(){
const static=document.createElement("div");
static.style.position="fixed";
static.style.width="100%";
static.style.height="100%";
static.style.background="url('https://i.imgur.com/8fK4h6N.png')";
static.style.zIndex="999";
document.body.appendChild(static);
setTimeout(()=>{window.location.href="page7.html";},350);
}

</script>

</body>
</html>
