<!DOCTYPE html>
<html>
<head>

<title>BEFORE_THE_TRAGEDY</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body{

color:white;

}

left:50%;
transform:translate(-50%,-50%);

}

button{
margin-top:20px;
padding:12px 25px;
border:2px solid white;

color:white;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="container">

<div style="opacity:.85;">

What followed was inevitable.
</div>

<button onclick="next()">FINAL WARNING</button>

</div>

<script>

</html>
