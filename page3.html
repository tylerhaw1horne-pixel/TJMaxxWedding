<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSITIVE_FILE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:grayscale(100%) contrast(120%);
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
z-index:-1;
}

.scan{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.6) 50%);
background-size:100% 3px;
}

.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:95%;
}

.imageBox{
width:160px;
height:160px;
border:2px solid white;
margin:10px;
display:inline-block;
animation:glitch 1.5s infinite;
}

@keyframes glitch{
0%{transform:translate(0,0);}
25%{transform:translate(-2px,2px);}
50%{transform:translate(2px,-2px);}
75%{transform:translate(-1px,1px);}
100%{transform:translate(0,0);}
}

button{
margin-top:25px;
padding:12px 30px;
border:2px solid white;
background:transparent;
color:white;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<div class="scan"></div>

<audio id="w" src="whisper.mp3" autoplay loop></audio>

<div class="container">

<div style="font-size:32px;">WARNING: SENSITIVE FILE</div>
<br>

<div>Ceremony Begins 5:00 PM</div>
<div>Reception To Follow</div>

<br><br>

<div class="imageBox"></div>
<div class="imageBox"></div>

<br>

<button onclick="next()">UNSEAL DETAILS</button>

</div>

<script>
document.getElementById("w").volume=.24;
function next(){
document.body.insertAdjacentHTML("beforeend","<div style='position:fixed;width:100%;height:100%;background:white;animation:fade .4s forwards;'></div>");
setTimeout(()=>{window.location.href='page4.html';},350);
}
</script>

</body>
</html>
