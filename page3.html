<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSITIVE_FILE</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* Intro flash */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  animation:flash .3s ease;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
}

.warning{
  font-size:16px;
  margin-bottom:20px;
  animation:flicker 2s infinite;
}

@keyframes flicker{
  0%,100%{opacity:1;}
  50%{opacity:.6;}
}

.details{
  opacity:0;
  transition:opacity 1.5s ease;
  line-height:1.8;
}

button{
  margin-top:30px;
  padding:8px 24px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
}

.hidden{display:none;}
</style>
</head>

<body>

<audio id="whisper" src="whisper.mp3" loop></audio>

<div class="center">

  <div class="warning">
    WARNING: SENSITIVE FILE
  </div>

  <div id="details" class="details">
    Tyler Hawthorne<br>
    &<br>
    Julie Eells<br><br>

    Request Your Presence<br><br>

    October 24, 2026<br>
    5:00 PM<br>
    The Conservatory<br>
    Acworth, Georgia<br><br>

    Reception To Follow
  </div>

  <button id="unsealBtn" class="hidden">UNSEAL DETAILS</button>

</div>

<script>
const whisper = document.getElementById("whisper");
const details = document.getElementById("details");
const unsealBtn = document.getElementById("unsealBtn");

/* Escalate whisper slightly */
whisper.volume = 0.22;
whisper.play();

/* Reveal details */
setTimeout(()=>{
  details.style.opacity = 1;
},2000);

setTimeout(()=>{
  unsealBtn.classList.remove("hidden");
},4500);

/* Next page */
unsealBtn.addEventListener("click",()=>{
  window.location.href="page4.html";
});
</script>

</body>
</html>
