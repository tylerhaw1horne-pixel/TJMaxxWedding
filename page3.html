<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSITIVE_FILE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* VIDEO */
video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
filter:grayscale(100%) contrast(150%);
animation:frameJitter 2.5s infinite;
}

@keyframes frameJitter{
0%,100%{transform:translate(0,0);}
30%{transform:translate(-2px,2px);}
60%{transform:translate(2px,-2px);}
}

/* STATIC */
.staticOverlay{
position:fixed;
width:100%;
height:100%;
background:url("https://i.imgur.com/8fK4h6N.png");
opacity:.12;
z-index:-1;
pointer-events:none;
}

/* SCANLINES */
.scanlines{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.05) 50%, rgba(0,0,0,.7) 50%);
background-size:100% 3px;
pointer-events:none;
}

/* VHS UI */
.vhsUI{
position:fixed;
top:10px;
left:10px;
font-size:12px;
opacity:.7;
}

.battery{
position:fixed;
top:10px;
right:10px;
font-size:12px;
opacity:.7;
}

/* SCREEN TEAR */
.tear{
position:fixed;
width:100%;
height:60px;
background:rgba(255,255,255,.08);
top:0;
animation:tearMove 5s infinite;
pointer-events:none;
}

@keyframes tearMove{
0%{top:-60px;}
100%{top:100%;}
}

/* TEXT GLITCH */
.glitch{
font-size:42px;
letter-spacing:4px;
animation:textGlitch .8s infinite;
}

@keyframes textGlitch{
0%{text-shadow:3px 0 red,-3px 0 blue;}
50%{text-shadow:-3px 0 red,3px 0 blue;}
100%{text-shadow:3px 0 red,-3px 0 blue;}
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:95%;
}

/* IMAGE PLACEHOLDERS */
.imageBox{
width:180px;
height:180px;
border:2px solid white;
display:inline-block;
margin:15px;
animation:imgGlitch 1.5s infinite;
}

@keyframes imgGlitch{
0%{transform:translate(0,0);}
25%{transform:translate(-4px,3px);}
50%{transform:translate(3px,-4px);}
75%{transform:translate(-2px,2px);}
100%{transform:translate(0,0);}
}

button{
margin-top:30px;
padding:14px 30px;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:2px;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="staticOverlay"></div>
<div class="scanlines"></div>
<div class="tear"></div>

<div class="vhsUI">REC ● 10.24.2026 21:17:48</div>
<div class="battery">BAT 69%</div>

<audio id="whisper" src="whisper.mp3" autoplay loop></audio>

<div class="center">

<div class="glitch">WARNING: SENSITIVE FILE</div>

<br><br>

<div style="font-size:28px;">
CEREMONY BEGINS 5:00 PM
</div>

<br>

<div style="opacity:.9;">
RECEPTION TO FOLLOW
</div>

<br><br>

<div class="imageBox"></div>
<div class="imageBox"></div>

<br>

<button onclick="staticNext()">UNSEAL DETAILS</button>

</div>

<script>

// whisper escalation
const w=document.getElementById("whisper");
let vol=.25;
w.volume=vol;
setInterval(()=>{
if(vol<.55){vol+=.01;w.volume=vol;}
},4000);

// random interference flash
setInterval(()=>{
if(Math.random()<0.25){
const flash=document.createElement("div");
flash.style.position="fixed";
flash.style.width="100%";
flash.style.height="100%";
flash.style.background="white";
flash.style.opacity=".6";
flash.style.zIndex="999";
document.body.appendChild(flash);
setTimeout(()=>{flash.remove();},80);
}
},5000);

// static transition
function staticNext(){
const static=document.createElement("div");
static.style.position="fixed";
static.style.width="100%";
static.style.height="100%";
static.style.background="url('https://i.imgur.com/8fK4h6N.png')";
static.style.zIndex="999";
document.body.appendChild(static);
setTimeout(()=>{window.location.href="page4.html";},350);
}

</script>

</body>
</html>
