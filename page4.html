<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THOSE_WHO_STAND</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:grayscale(100%) contrast(130%);
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
z-index:-1;
}

.scan{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.6) 50%);
background-size:100% 3px;
}

.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:95%;
text-align:center;
}

.title{
font-size:34px;
letter-spacing:4px;
margin-bottom:20px;
animation:flicker 2s infinite;
}

@keyframes flicker{
0%,100%{opacity:1;}
50%{opacity:.6;}
}

.grid{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
}

.member{
width:45%;
margin-bottom:25px;
animation:shake 2s infinite;
}

@keyframes shake{
0%,100%{transform:translate(0);}
50%{transform:translate(1px,-1px);}
}

.photo{
height:160px;
border:2px solid white;
margin-bottom:10px;
animation:glitch 1.2s infinite;
}

@keyframes glitch{
0%{transform:translate(0,0);}
25%{transform:translate(-3px,2px);}
50%{transform:translate(2px,-3px);}
75%{transform:translate(-2px,1px);}
100%{transform:translate(0,0);}
}

button{
margin-top:20px;
padding:12px 30px;
border:2px solid white;
background:transparent;
color:white;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<div class="scan"></div>

<audio id="w" src="whisper.mp3" autoplay loop></audio>

<div class="container">

<div class="title">THOSE WHO STAND</div>

<div class="grid">
<div class="member">
<div class="photo"></div>
<div>Bridesmaid Name</div>
</div>
<div class="member">
<div class="photo"></div>
<div>Groomsman Name</div>
</div>
<div class="member">
<div class="photo"></div>
<div>Bridesmaid Name</div>
</div>
<div class="member">
<div class="photo"></div>
<div>Groomsman Name</div>
</div>
</div>

<button onclick="next()">PROCEED ANYWAY</button>

</div>

<script>
document.getElementById("w").volume=.28;
function next(){
document.body.insertAdjacentHTML("beforeend","<div style='position:fixed;width:100%;height:100%;background:white;'></div>");
setTimeout(()=>{window.location.href='page5.html';},300);
}
</script>

</body>
</html>
