<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THOSE_WHO_STAND</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:black;
  color:white;
  font-family:'Share Tech Mono', monospace;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  animation:flash .3s ease;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

.container{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:95%;
  max-width:1000px;
  text-align:center;
}

.title{
  margin-bottom:30px;
  font-size:18px;
  animation:flicker 2s infinite;
}

@keyframes flicker{
  0%,100%{opacity:1;}
  50%{opacity:.6;}
}

.grid{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.column{
  width:50%;
}

.member{
  margin-bottom:25px;
  opacity:0;
  transform:translateY(20px);
  transition:all .8s ease;
}

.member.show{
  opacity:1;
  transform:translateY(0);
}

.member img{
  width:80px;
  height:80px;
  object-fit:cover;
  border:1px solid white;
  margin-bottom:8px;
  filter:grayscale(100%) contrast(120%);
}

button{
  margin-top:30px;
  padding:8px 24px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
}
</style>
</head>

<body>

<audio id="whisper" src="whisper.mp3" loop></audio>

<div class="container">

  <div class="title">THOSE WHO STAND</div>

  <div class="grid">

    <div class="column">
      <div class="member"><img src="bride1.jpg"><div>Bridesmaid Name</div></div>
      <div class="member"><img src="bride2.jpg"><div>Bridesmaid Name</div></div>
      <div class="member"><img src="bride3.jpg"><div>Bridesmaid Name</div></div>
    </div>

    <div class="column">
      <div class="member"><img src="groom1.jpg"><div>Groomsman Name</div></div>
      <div class="member"><img src="groom2.jpg"><div>Groomsman Name</div></div>
      <div class="member"><img src="groom3.jpg"><div>Groomsman Name</div></div>
    </div>

  </div>

  <button id="nextBtn">PROCEED ANYWAY</button>

</div>

<script>
const whisper = document.getElementById("whisper");
const members = document.querySelectorAll(".member");
const nextBtn = document.getElementById("nextBtn");

/* Increase whisper intensity */
whisper.volume = 0.28;
whisper.play();

/* Glitch-in reveal */
members.forEach((member, index)=>{
  setTimeout(()=>{
    member.classList.add("show");
  }, 800 + (index * 600));
});

/* Next page */
nextBtn.addEventListener("click",()=>{
  window.location.href="page5.html";
});
</script>

</body>
</html>
