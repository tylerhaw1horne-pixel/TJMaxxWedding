<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST_TAPE_01</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* VIDEO */
video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
filter:grayscale(100%) contrast(130%);
animation:frameJitter 4s infinite;
}

/* FRAME JITTER */
@keyframes frameJitter{
0%,100%{transform:translate(0,0);}
25%{transform:translate(-1px,1px);}
50%{transform:translate(1px,-1px);}
75%{transform:translate(-1px,-1px);}
}

/* ANALOG STATIC OVERLAY */
.staticOverlay{
position:fixed;
width:100%;
height:100%;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,0.03) 0px,
rgba(255,255,255,0.03) 1px,
transparent 1px,
transparent 2px
);
pointer-events:none;
z-index:-1;
animation:noiseMove 0.2s infinite;
}

@keyframes noiseMove{
0%{transform:translate(0,0);}
50%{transform:translate(-1px,1px);}
100%{transform:translate(1px,-1px);}
}

/* SCANLINES */
.scanlines{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.6) 50%);
background-size:100% 3px;
pointer-events:none;
z-index:0;
}

/* CAM UI */
.vhsUI{
position:fixed;
top:10px;
left:10px;
font-size:12px;
opacity:.7;
z-index:5;
}

.battery{
position:fixed;
top:10px;
right:10px;
font-size:12px;
opacity:.7;
z-index:5;
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:90%;
}

button{
margin-top:25px;
padding:12px 28px;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:2px;
font-size:14px;
}

/* TRACKING ROLL */
@keyframes tracking{
0%{background-position:0 0;}
100%{background-position:0 100%;}
}
.tracking{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.05), transparent);
animation:tracking 5s linear infinite;
pointer-events:none;
}
</style>
</head>

<body>

<div class="staticOverlay"></div>
<div class="scanlines"></div>
<div class="tracking"></div>

<div class="vhsUI">REC ● 10.24.2026 21:13:07</div>
<div class="battery">BAT 73%</div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<div class="center" id="intro">
<div style="opacity:.6;">SIGNAL RESTORED</div>
<br>
<button onclick="playTape()">▶ PLAY TAPE</button>
</div>

<script>

const whisper = document.getElementById("whisper");

function playTape(){

// static blast
const blast = document.createElement("div");
blast.style.position="fixed";
blast.style.width="100%";
blast.style.height="100%";
blast.style.background="black";
blast.style.backgroundImage="url('https://i.imgur.com/8fK4h6N.png')";
blast.style.zIndex="999";
document.body.appendChild(blast);

setTimeout(()=>{blast.remove();},250);

// load forest
document.body.insertAdjacentHTML("afterbegin",`
<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>
`);

document.getElementById("intro").remove();

// escalate whisper slowly
whisper.volume=0.05;
whisper.play();

let vol=0.05;
setInterval(()=>{
if(vol<0.4){
vol+=0.01;
whisper.volume=vol;
}
},4000);

// show STAY QUIET
setTimeout(()=>{
document.body.insertAdjacentHTML("beforeend",`
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:90%;">
<div style="font-size:42px;letter-spacing:4px;animation:flicker 1.5s infinite;">STAY QUIET</div>
<button onclick="nextPage()">KEEP WALKING</button>
</div>
`);
},1500);

}

// static transition
function nextPage(){
const static = document.createElement("div");
static.style.position="fixed";
static.style.width="100%";
static.style.height="100%";
static.style.background="black";
static.style.backgroundImage="repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0px, rgba(255,255,255,.08) 1px, transparent 1px, transparent 3px)";
static.style.zIndex="999";
document.body.appendChild(static);

setTimeout(()=>{
window.location.href="page2.html";
},350);
}

// random signal drop
setInterval(()=>{
if(Math.random()<0.15){
document.body.style.filter="brightness(0)";
setTimeout(()=>{document.body.style.filter="none";},120);
}
},6000);

</script>

</body>
</html>
