<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>October 24, 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:black;
  color:white;
  font-family:'Special Elite', monospace;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* Film grain overlay */
body::after{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.25;
  pointer-events:none;
  mix-blend-mode:overlay;
}

/* Fog animation */
.fog{
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(circle at center, rgba(255,255,255,.05) 0%, transparent 70%);
  animation:fogMove 40s linear infinite;
}

@keyframes fogMove{
  from{transform:translate(-25%, -25%)}
  to{transform:translate(0%, 0%)}
}

/* Flicker */
@keyframes flicker{
  0%,18%,22%,25%,53%,57%,100%{opacity:1;}
  20%,24%,55%{opacity:0.4;}
}

.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.title{
  font-family:'Creepster', cursive;
  font-size:4rem;
  letter-spacing:3px;
  animation:flicker 4s infinite;
}

.date{
  margin-top:20px;
  font-size:1.2rem;
  opacity:.7;
  letter-spacing:4px;
}

.enter-btn{
  margin-top:50px;
  padding:15px 40px;
  background:transparent;
  border:1px solid white;
  color:white;
  letter-spacing:3px;
  cursor:pointer;
  transition:.4s;
}

.enter-btn:hover{
  background:white;
  color:black;
  transform:scale(1.05);
}

/* subtle heartbeat */
@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1);}
  50%{transform:translate(-50%,-50%) scale(1.02);}
  100%{transform:translate(-50%,-50%) scale(1);}
}

.center{
  animation:pulse 6s infinite ease-in-out;
}

/* hidden audio */
audio{
  display:none;
}

</style>
</head>

<body>

<div class="fog"></div>

<div class="center">
  <div class="title">THE COVENANT</div>
  <div class="date">OCTOBER 24 • 2026</div>
  <button class="enter-btn" onclick="enterSite()">ENTER IF YOU DARE</button>
</div>

<audio id="ambience" autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4b7f1c93fa.mp3?filename=dark-wind-ambience-11037.mp3" type="audio/mpeg">
</audio>

<script>
function enterSite(){
  document.body.style.background = "black";
  document.querySelector(".title").innerText = "YOU WERE WARNED";
  document.querySelector(".enter-btn").style.display="none";
}
</script>

</body>
</html>
