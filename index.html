<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10.24.2026</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* VIDEO */
video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(1) contrast(1.3) brightness(.55);
  animation:handheld 8s ease-in-out infinite;
}

/* Subtle handheld sway */
@keyframes handheld{
  0%{transform:scale(1.05) translate(0px,0px);}
  25%{transform:scale(1.05) translate(-5px,3px);}
  50%{transform:scale(1.05) translate(4px,-4px);}
  75%{transform:scale(1.05) translate(-3px,2px);}
  100%{transform:scale(1.05) translate(0px,0px);}
}

/* Softer Vignette */
.vignette{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center, transparent 65%, rgba(0,0,0,.85) 100%);
  pointer-events:none;
}

/* Light Grain */
.grain{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.25;
  pointer-events:none;
}

/* Softer Scanlines */
.scanlines{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.3) 50%);
  background-size:100% 4px;
  pointer-events:none;
}

/* REC */
.rec{
  position:absolute;
  top:25px;
  left:35px;
  font-size:18px;
}

.rec span{
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

/* Timestamp */
.timestamp{
  position:absolute;
  bottom:25px;
  left:35px;
  font-size:18px;
}

/* Center Title Smaller */
.center{
  position:absolute;
  top:55%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  animation:flicker 6s infinite;
}

@keyframes flicker{
  0%,94%,100%{opacity:1;}
  95%{opacity:.6;}
  96%{opacity:1;}
}

.title{
  font-size:40px;
  letter-spacing:4px;
}

button{
  margin-top:30px;
  padding:8px 28px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:white;
  color:black;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="forrest%20(2).mp4" type="video/mp4">
</video>

<div class="vignette"></div>
<div class="grain"></div>
<div class="scanlines"></div>
<div class="tracking"></div>
<div class="flash"></div>

<div class="rec"><span>●</span> REC</div>
<div class="timestamp" id="timestamp"></div>

<div class="center">
  <div class="title">YOU ARE MARKED</div>
  <button>PLAY TAPE</button>
</div>

<script>
function updateTime(){
  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  const date = pad(now.getMonth()+1)+"."+pad(now.getDate())+"."+now.getFullYear();
  const time = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  document.getElementById("timestamp").innerText = date+"  "+time;
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
