<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST_TAPE_01</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* VIDEO LAYER */
video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:0;
filter:grayscale(100%) contrast(150%);
animation:slowZoom 14s infinite ease-in-out;
}

@keyframes slowZoom{
0%{transform:scale(1);}
50%{transform:scale(1.04);}
100%{transform:scale(1);}
}

/* SCANLINES */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
background:linear-gradient(rgba(255,255,255,.05) 50%, rgba(0,0,0,.85) 50%);
background-size:100% 3px;
z-index:2;
}

/* UI LAYER */
.ui{
position:relative;
z-index:3;
text-align:center;
top:50%;
transform:translateY(-50%);
width:90%;
margin:auto;
}

button{
margin-top:25px;
padding:12px 28px;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:2px;
font-size:14px;
}

/* VHS UI TEXT */
.vhsUI{
position:fixed;
top:10px;
left:10px;
font-size:12px;
opacity:.7;
z-index:3;
}

.battery{
position:fixed;
top:10px;
right:10px;
font-size:12px;
opacity:.7;
z-index:3;
}
</style>
</head>

<body>

<!-- VIDEO -->
<video id="bgVideo" autoplay muted loop playsinline style="display:none;">
  <source src="forrest vid.mp4" type="video/mp4">
</video>

<!-- VHS UI -->
<div class="vhsUI">REC ● 10.24.2026 21:13:07</div>
<div class="battery">BAT 73%</div>

<!-- INTRO UI -->
<div class="ui" id="intro">
<div style="opacity:.6;">SIGNAL RESTORED</div>
<button onclick="playTape()">▶ PLAY TAPE</button>
</div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<script>

/* ===== PLAY TAPE FUNCTION ===== */

function playTape(){

// Static blackout transition
const static = document.createElement("div");
static.style.position="fixed";
static.style.top=0;
static.style.left=0;
static.style.width="100%";
static.style.height="100%";
static.style.background="black";
static.style.zIndex="9999";
document.body.appendChild(static);

setTimeout(()=>{
static.remove();
document.getElementById("bgVideo").style.display="block";
document.getElementById("intro").remove();
},300);

// Start whisper gradually
const whisper = document.getElementById("whisper");
whisper.volume = 0.05;
whisper.play();

let vol = 0.05;
setInterval(()=>{
if(vol < 0.4){
vol += 0.01;
whisper.volume = vol;
}
},4000);

// Show STAY QUIET overlay after video loads
setTimeout(()=>{
const ui = document.createElement("div");
ui.className="ui";
ui.innerHTML = `
<div style="font-size:42px;letter-spacing:4px;">STAY QUIET</div>
<button onclick="staticNext('page2.html')">KEEP WALKING</button>
`;
document.body.appendChild(ui);
},1200);
}

/* ===== STATIC TRANSITION ===== */

function staticNext(page){
const static = document.createElement("div");
static.style.position="fixed";
static.style.top=0;
static.style.left=0;
static.style.width="100%";
static.style.height="100%";
static.style.background="black";
static.style.zIndex="9999";
document.body.appendChild(static);

setTimeout(()=>{
window.location.href = page;
},250);
}

/* ===== REAL CANVAS NOISE (SUBTLE) ===== */

const canvas = document.createElement("canvas");
canvas.style.position = "fixed";
canvas.style.top = 0;
canvas.style.left = 0;
canvas.style.width = "100%";
canvas.style.height = "100%";
canvas.style.pointerEvents = "none";
canvas.style.zIndex = "1";
canvas.style.opacity = "0.15";
document.body.appendChild(canvas);

const ctx = canvas.getContext("2d");

function resize(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function drawNoise(){
const imageData = ctx.createImageData(canvas.width, canvas.height);
const buffer32 = new Uint32Array(imageData.data.buffer);
for (let i = 0; i < buffer32.length; i++) {
  const shade = Math.random() * 255 | 0;
  buffer32[i] = (255 << 24) | (shade << 16) | (shade << 8) | shade;
}
ctx.putImageData(imageData, 0, 0);
requestAnimationFrame(drawNoise);
}
drawNoise();

/* ===== TRACKING ROLL ===== */

function trackingRoll(){
const roll = document.createElement("div");
roll.style.position="fixed";
roll.style.left=0;
roll.style.width="100%";
roll.style.height="60px";
roll.style.background="rgba(255,255,255,0.15)";
roll.style.zIndex="2";
roll.style.top="-60px";
roll.style.pointerEvents="none";
document.body.appendChild(roll);

let pos=-60;
const interval=setInterval(()=>{
pos+=6;
roll.style.top=pos+"px";
if(pos>window.innerHeight){
clearInterval(interval);
roll.remove();
}
},16);
}

setInterval(()=>{
if(Math.random()<0.15){
trackingRoll();
}
},7000);

/* ===== SIGNAL DROP ===== */

setInterval(()=>{
if(Math.random()<0.1){
document.body.style.filter="brightness(0)";
setTimeout(()=>{document.body.style.filter="none";},120);
}
},8000);

</script>

</body>
</html>
