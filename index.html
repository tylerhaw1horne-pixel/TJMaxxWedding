<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>October 24, 2026</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:black;
  font-family:'VT323', monospace;
  overflow:hidden;
  color:#00ff9c;
}

/* Background forest */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1950&q=80");
  background-size:cover;
  background-position:center;
  filter:brightness(.25) contrast(1.3) grayscale(.6);
  animation:slowZoom 50s infinite alternate ease-in-out;
}

@keyframes slowZoom{
  from{transform:scale(1)}
  to{transform:scale(1.06)}
}

/* VHS scanlines */
.scanlines{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(
    rgba(0,0,0,0) 50%, 
    rgba(0,0,0,0.4) 50%
  );
  background-size:100% 4px;
  pointer-events:none;
  mix-blend-mode:overlay;
}

/* Static noise */
body::after{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.4;
  mix-blend-mode:overlay;
  pointer-events:none;
}

/* Camcorder overlay */
.camera-overlay{
  position:fixed;
  width:100%;
  height:100%;
  border:4px solid #00ff9c;
  pointer-events:none;
}

.rec{
  position:absolute;
  top:20px;
  left:20px;
  font-size:20px;
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

.timestamp{
  position:absolute;
  bottom:20px;
  left:20px;
  font-size:22px;
  letter-spacing:2px;
}

.battery{
  position:absolute;
  top:20px;
  right:20px;
  font-size:20px;
}

/* Center text */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  animation:glitch 3s infinite;
}

.title{
  font-size:70px;
  letter-spacing:6px;
}

.date{
  margin-top:20px;
  font-size:28px;
}

.enter{
  margin-top:50px;
  padding:10px 40px;
  border:2px solid #00ff9c;
  background:transparent;
  color:#00ff9c;
  font-family:'VT323', monospace;
  font-size:24px;
  cursor:pointer;
  transition:.3s;
}

.enter:hover{
  background:#00ff9c;
  color:black;
}

/* Glitch */
@keyframes glitch{
  0%{transform:translate(-50%,-50%)}
  20%{transform:translate(-49%,-50%)}
  40%{transform:translate(-51%,-50%)}
  60%{transform:translate(-50%,-49%)}
  80%{transform:translate(-50%,-51%)}
  100%{transform:translate(-50%,-50%)}
}

/* Random horizontal glitch bar */
.glitch-bar{
  position:fixed;
  width:100%;
  height:60px;
  background:rgba(0,255,156,.2);
  top:-100px;
  animation:barMove 8s infinite;
}

@keyframes barMove{
  0%{top:-100px}
  50%{top:100%}
  100%{top:-100px}
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="scanlines"></div>
<div class="camera-overlay"></div>
<div class="glitch-bar"></div>

<div class="rec">● REC</div>
<div class="battery">BATTERY ▮▮▮▮▯</div>
<div class="timestamp">10.24.2026  19:04:12</div>

<div class="center">
  <div class="title">YOU ARE MARKED</div>
  <div class="date">ENTER THE WOODS</div>
  <button class="enter">PLAY TAPE</button>
</div>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4b7f1c93fa.mp3?filename=dark-wind-ambience-11037.mp3" type="audio/mpeg">
</audio>

</body>
</html>
