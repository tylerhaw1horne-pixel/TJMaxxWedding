<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovered Archive — 10.24.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */

*{margin:0;padding:0;box-sizing:border-box;}
html,body{
height:100%;
width:100%;
background:black;
color:white;
font-family:'Share Tech Mono',monospace;
overflow:hidden;
}

/* ================= BACKGROUND VIDEO ================= */

.videoWrapper{
position:fixed;
inset:0;
z-index:0;
}

#bgVideo{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.75) contrast(1.2);
}

/* ================= ATMOSPHERE ================= */

.dark{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:1;
pointer-events:none;
}

.scan{
position:fixed;
inset:0;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.02),
rgba(255,255,255,.02) 1px,
transparent 1px,
transparent 3px
);
z-index:2;
pointer-events:none;
animation:scanMove 7s linear infinite;
}

@keyframes scanMove{
0%{background-position:0 0;}
100%{background-position:0 120px;}
}

/* ================= SCREEN SYSTEM ================= */

.screen{
position:fixed;
inset:0;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:60px 40px;
z-index:10;
}

.screen.active{
display:flex;
animation:fadeScreen .8s ease forwards;
}

@keyframes fadeScreen{
from{opacity:0;}
to{opacity:1;}
}

/* ================= TEXT ================= */

h2{
letter-spacing:6px;
font-size:22px;
margin-bottom:25px;
opacity:0;
transform:translateY(15px);
transition:all 1.2s ease;
}

.storyText{
max-width:720px;
line-height:1.8;
font-size:14px;
opacity:0;
transform:translateY(15px);
transition:all 1.6s ease;
margin-bottom:35px;
}

.screen.active h2,
.screen.active .storyText{
opacity:1;
transform:translateY(0);
}

/* ================= IMAGE SYSTEM ================= */

/* ================= IMAGE SYSTEM (VERTICAL STACKED) ================= */

.imageRow{
display:flex;
flex-direction:column;
align-items:center;
gap:40px;
margin:40px 0 60px 0;
width:100%;
}

.imagePanel{
width:520px;
height:300px;
overflow:hidden;
border:2px solid rgba(255,255,255,.35);
box-shadow:0 0 60px rgba(0,0,0,.9);
opacity:0;
transform:scale(1.05);
transition:opacity 1.2s ease, transform 6s ease;
}

.imagePanel img{
width:100%;
height:100%;
object-fit:cover;
}

/* reveal */
.imagePanel.show{
opacity:1;
transform:scale(1);
animation:subtlePulse 6s infinite alternate;
}

@keyframes subtlePulse{
0%{filter:brightness(1);}
50%{filter:brightness(1.05);}
100%{filter:brightness(.95);}
}

/* ================= BUTTONS ================= */

button{
padding:12px 34px;
border:2px solid white;
background:black;
color:white;
letter-spacing:4px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:black;
}

.continueBtn{
margin-top:60px;
}

/* ================= WEDDING PARTY ================= */

.partyContainer{
margin-top:80px;
display:flex;
justify-content:center;
gap:80px;
flex-wrap:wrap;
}

.partyCard{
background:rgba(0,0,0,.95);
padding:60px 50px;
width:340px;
border:1px solid rgba(255,255,255,.2);
box-shadow:
0 0 80px rgba(255,0,0,.1),
0 0 40px rgba(255,255,255,.05);
}

.partyCard h3{
letter-spacing:5px;
margin-bottom:30px;
border-bottom:1px solid rgba(255,255,255,.3);
padding-bottom:12px;
font-size:15px;
}

.partyCard div{
margin-bottom:14px;
font-size:13px;
letter-spacing:2px;
}

/* ================= DONATION ================= */

.donationVault{
margin-top:80px;
display:flex;
justify-content:center;
width:100%;
}

.vaultInner{
background:rgba(0,0,0,.95);
padding:80px 70px;
width:500px;
border:1px solid rgba(255,255,255,.2);
box-shadow:
0 0 100px rgba(255,0,0,.15),
0 0 50px rgba(255,255,255,.05);
text-align:center;
}

.vaultInner p{
margin-bottom:50px;
font-size:14px;
letter-spacing:2px;
}

.donationButtons{
display:flex;
flex-direction:column;
gap:25px;
}

.donateBtn{
width:260px;
align-self:center;
}

/* ================= CRASH SYSTEM ================= */

.static{
position:fixed;
inset:0;
background:repeating-linear-gradient(
0deg,white 0px,white 2px,black 2px,black 4px
);
display:none;
z-index:999;
}

.whiteFlash{
position:fixed;
inset:0;
background:white;
opacity:0;
z-index:998;
pointer-events:none;
}

.whiteFlash.active{
animation:flashFX .4s ease;
}

@keyframes flashFX{
50%{opacity:.9;}
}

.screenShake{
animation:shake .2s linear infinite;
}

@keyframes shake{
25%{transform:translate(-8px,4px);}
50%{transform:translate(8px,-4px);}
}

.rewindVideo{
animation:rewindFX 1.5s ease forwards;
}

@keyframes rewindFX{
50%{transform:scaleX(-1);}
}

.ending{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:black;
font-size:24px;
letter-spacing:8px;
z-index:1000;
}

/* ================= MOBILE ================= */

@media (max-width:768px){

.screen{
padding:40px 20px;
overflow-y:auto;
}

.imagePanel{
width:100%;
height:200px;
}

.storyText{
max-width:100%;
}

.partyCard{
width:100%;
}

.vaultInner{
width:100%;
padding:50px 30px;
}

.donateBtn{
width:100%;
}

}
</head>

<body>

<div class="videoWrapper">
<video id="bgVideo" autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>
</div>

<div class="dark"></div>
<div class="scan"></div>
<div class="static" id="static"></div>
<div class="whiteFlash" id="whiteFlash"></div>
<div class="ending" id="ending">TRANSMISSION LOST</div>

<audio id="whisper" src="whisper.mp3" loop></audio>
<audio id="screech" src="screech.mp3"></audio>

<!-- ================= CHAPTER 1 ================= -->

<div class="screen active" id="c1">
<h2>ARCHIVE 10.24.2026</h2>
<div class="storyText">
Recovered recording. Playback unstable.
</div>
<button onclick="goTo(2)">INITIATE PLAYBACK</button>
</div>


<!-- ================= CHAPTER 2 ================= -->

<div class="screen" id="c2">
<h2>RECONNECTION LOG</h2>

<div class="imageRow">
  <div class="imagePanel"><img src="c2-1.jpg"></div>
</div>

<div class="storyText">
(Insert chapter 2 text here.)
</div>

<div class="imageRow">
  <div class="imagePanel"><img src="c2-2.jpg"></div>
</div>

<button class="continueBtn" onclick="goTo(3)">CONTINUE</button>
</div>


<!-- ================= CHAPTER 3 ================= -->

<div class="screen" id="c3">
<h2>OUR STORY</h2>

<div class="imageRow">
  <div class="imagePanel"><img src="c3-1.jpg"></div>
</div>

<div class="storyText">
(Insert chapter 3 text here.)
</div>

<div class="imageRow">
  <div class="imagePanel"><img src="c3-2.jpg"></div>
</div>

<button class="continueBtn" onclick="goTo(4)">CONTINUE</button>
</div>

<!-- ================= CHAPTER 4 ================= -->

<div class="screen" id="c4">
<h2>WEDDING DETAILS</h2>
<div class="storyText">
October 24, 2026<br>
5:00 PM – 9:00 PM<br>
The Conservatory — Acworth, GA
</div>
<button class="continueBtn" onclick="goTo(5)">CONTINUE</button>
</div>

<!-- ================= CHAPTER 5 ================= -->

<div class="screen" id="c5">
<h2>WEDDING PARTY</h2>

<div class="partyContainer">
<div class="partyCard">
<h3>BRIDE'S PARTY</h3>
<div>Name — Role</div>
<div>Name — Role</div>
</div>

<div class="partyCard">
<h3>GROOM'S PARTY</h3>
<div>Name — Role</div>
<div>Name — Role</div>
</div>
</div>

<button class="continueBtn" onclick="goTo(6)">CONTINUE</button>
</div>

<!-- ================= CHAPTER 6 ================= -->

<div class="screen" id="c6">
<h2>CONTRIBUTION PORTAL</h2>

<div class="donationVault">
<div class="vaultInner">
<p>If you wish to contribute to our future, you may do so below.</p>
<div class="donationButtons">
<a href="#"><button class="donateBtn">APPLE CASH</button></a>
<a href="#"><button class="donateBtn">ZELLE</button></a>
</div>
</div>
</div>

<button class="continueBtn" onclick="goTo(7)">CONTINUE</button>
</div>

<!-- ================= CHAPTER 7 ================= -->

<div class="screen" id="c7">
<h2>ENTER THE ARCHIVE</h2>
<div class="storyText">Please confirm your presence.</div>

<div style="margin-top:40px; display:flex; flex-direction:column; gap:18px; width:320px;">
<input type="text" placeholder="Your Name" style="padding:10px;background:black;border:1px solid white;color:white;">
<input type="email" placeholder="Email" style="padding:10px;background:black;border:1px solid white;color:white;">
<select style="padding:10px;background:black;border:1px solid white;color:white;">
<option>Attending</option>
<option>Not Attending</option>
</select>
<textarea placeholder="Message" style="padding:10px;height:80px;background:black;border:1px solid white;color:white;"></textarea>
<button>SUBMIT RSVP</button>
</div>

<button style="margin-top:50px;" onclick="endTransmission()">FINALIZE TRANSMISSION</button>
</div>

<script>

let whisperStarted=false;
const whisper=document.getElementById("whisper");

function startWhisper(){
if(!whisperStarted){
whisper.volume=.08;
whisper.play().catch(()=>{});
whisperStarted=true;
}
}

function goTo(n){
startWhisper();

whisper.volume=.25;
setTimeout(()=>whisper.volume=.08,300);

document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
const target=document.getElementById("c"+n);
target.classList.add("active");

target.querySelectorAll(".imagePanel").forEach((panel,i)=>{
setTimeout(()=>panel.classList.add("show"),i*800);
});
}

function endTransmission(){

const video=document.getElementById("bgVideo");
const flash=document.getElementById("whiteFlash");
const staticLayer=document.getElementById("static");
const ending=document.getElementById("ending");
const screech=document.getElementById("screech");

whisper.volume=.5;

document.body.classList.add("screenShake");
video.classList.add("rewindVideo");

setTimeout(()=>flash.classList.add("active"),600);

setTimeout(()=>{
screech.volume=.7;
screech.play();
whisper.pause();
},900);

setTimeout(()=>{
staticLayer.style.display="block";
},1500);

setTimeout(()=>{
ending.style.display="flex";
},3000);
}

</script>

</body>
</html>
