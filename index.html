<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10.24.2026</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* LOCAL VIDEO */
video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(1) contrast(1.5) brightness(.4);
}

/* overlay darkness */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.55);
}

/* grain */
.grain{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.6;
  pointer-events:none;
}

/* scanlines */
.scanlines{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.6) 50%);
  background-size:100% 3px;
  pointer-events:none;
}

/* REC */
.rec{
  position:absolute;
  top:20px;
  left:30px;
  font-size:18px;
}

.rec span{
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

/* timestamp */
.timestamp{
  position:absolute;
  bottom:20px;
  left:30px;
  font-size:18px;
}

/* title */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.title{
  font-size:60px;
  letter-spacing:6px;
}

button{
  margin-top:40px;
  padding:10px 35px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  background:white;
  color:black;
}

</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="forest.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<div class="grain"></div>
<div class="scanlines"></div>

<div class="rec"><span>●</span> REC</div>
<div class="timestamp" id="timestamp"></div>

<div class="center">
  <div class="title">YOU ARE MARKED</div>
  <button>PLAY TAPE</button>
</div>

<script>
function updateTime(){
  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  const date = pad(now.getMonth()+1)+"."+pad(now.getDate())+"."+now.getFullYear();
  const time = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  document.getElementById("timestamp").innerText = date+"  "+time;
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
