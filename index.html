<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10.24.2026</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* layered fake forest silhouettes */
.layer{
  position:fixed;
  width:120%;
  height:120%;
  top:-10%;
  left:-10%;
  background:radial-gradient(circle at center, #111 0%, #000 70%);
  animation:drift 20s infinite alternate ease-in-out;
}

.layer:before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:
  linear-gradient(to top, black 0%, transparent 40%),
  repeating-linear-gradient(
    90deg,
    rgba(0,0,0,0.8) 0px,
    rgba(0,0,0,0.8) 2px,
    transparent 2px,
    transparent 60px
  );
  opacity:.6;
}

/* slow handheld drift */
@keyframes drift{
  0%{transform:scale(1.05) translate(0px,0px);}
  50%{transform:scale(1.08) translate(-40px,20px);}
  100%{transform:scale(1.05) translate(0px,0px);}
}

/* flashlight */
.flashlight{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center, rgba(255,255,255,.15) 0%, rgba(0,0,0,.9) 65%);
  pointer-events:none;
}

/* heavy grain */
body::after{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.8;
  pointer-events:none;
}

/* scanlines */
.scanlines{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.7) 50%);
  background-size:100% 3px;
  pointer-events:none;
}

/* tracking glitch */
.tracking{
  position:fixed;
  width:100%;
  height:100px;
  background:rgba(255,255,255,.2);
  top:-120px;
  animation:track 6s infinite;
}

@keyframes track{
  0%{top:-120px;}
  50%{top:100%;}
  100%{top:-120px;}
}

/* sudden blackout glitch */
@keyframes blackout{
  0%,97%,100%{opacity:0;}
  98%{opacity:1;}
}

.blackout{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  opacity:0;
  animation:blackout 8s infinite;
}

/* REC */
.rec{
  position:absolute;
  top:20px;
  left:30px;
  font-size:18px;
}

.rec span{
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

/* timestamp */
.timestamp{
  position:absolute;
  bottom:20px;
  left:30px;
  font-size:18px;
}

/* title glitch */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  animation:flicker 4s infinite;
}

@keyframes flicker{
  0%,95%,100%{opacity:1;}
  96%{opacity:.5;}
  97%{opacity:1;}
}

.title{
  font-size:55px;
  letter-spacing:6px;
}

button{
  margin-top:40px;
  padding:10px 35px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:white;
  color:black;
}

</style>
</head>

<body>

<div class="layer"></div>
<div class="flashlight"></div>
<div class="scanlines"></div>
<div class="tracking"></div>
<div class="blackout"></div>

<div class="rec"><span>●</span> REC</div>
<div class="timestamp" id="timestamp"></div>

<div class="center">
  <div class="title">YOU ARE MARKED</div>
  <button>PLAY TAPE</button>
</div>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_4f8f8211e4.mp3?filename=forest-night-ambient-11015.mp3" type="audio/mpeg">
</audio>

<script>
function updateTime(){
  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  const date = pad(now.getMonth()+1)+"."+pad(now.getDate())+"."+now.getFullYear();
  const time = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  document.getElementById("timestamp").innerText = date+"  "+time;
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
