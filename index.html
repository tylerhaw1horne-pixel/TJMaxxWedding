<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10.24.2026</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* VIDEO */
video{
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .08s, filter .08s;
}

/* Grain */
.grain{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.25;
  pointer-events:none;
}

/* Scanlines */
.scanlines{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.4) 50%);
  background-size:100% 3px;
  pointer-events:none;
}

/* Vignette */
.vignette{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center, transparent 70%, rgba(0,0,0,.85) 100%);
  pointer-events:none;
}

/* Static Flash */
.static{
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
}

/* Blackout */
.blackout{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  opacity:0;
  pointer-events:none;
}

/* Screen tear */
.tear{
  position:fixed;
  width:100%;
  height:5px;
  background:white;
  opacity:0;
  pointer-events:none;
}

/* REC */
.rec{
  position:absolute;
  top:25px;
  left:35px;
  font-size:18px;
}
.rec span{
  color:red;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0;}}

/* Timestamp */
.timestamp{
  position:absolute;
  bottom:25px;
  left:35px;
  font-size:18px;
}

/* Title */
.center{
  position:absolute;
  top:55%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}
.title{
  font-size:38px;
  letter-spacing:4px;
}
button{
  margin-top:25px;
  padding:8px 28px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  background:white;
  color:black;
}
</style>
</head>

<body>

<video id="vid" autoplay muted loop playsinline>
  <source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="grain"></div>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="static" id="static"></div>
<div class="blackout" id="blackout"></div>
<div class="tear" id="tear"></div>

<div class="rec"><span>●</span> REC</div>
<div class="timestamp" id="timestamp"></div>

<div class="center">
  <div class="title">YOU ARE MARKED</div>
  <button>PLAY TAPE</button>
</div>

<script>
/* Timestamp */
function updateTime(){
  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  const date = pad(now.getMonth()+1)+"."+pad(now.getDate())+"."+now.getFullYear();
  const time = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  document.getElementById("timestamp").innerText = date+"  "+time;
}
setInterval(updateTime,1000);
updateTime();

const video = document.getElementById("vid");
const staticEl = document.getElementById("static");
const blackout = document.getElementById("blackout");
const tear = document.getElementById("tear");

let intensity = 1;

/* Immediate 5 second scare burst */
setTimeout(()=>{
  video.style.transform = "scale(1.3)";
  video.style.filter = "brightness(0.3)";
  staticEl.style.opacity = .5;
  setTimeout(()=>{
    staticEl.style.opacity = 0;
    video.style.transform = "scale(1)";
    video.style.filter = "brightness(1)";
  },300);
},3000);

/* Escalation loop */
function horrorCycle(){

  const r = Math.random();

  /* Static */
  if(r < 0.25 * intensity){
    staticEl.style.opacity = .4;
    setTimeout(()=> staticEl.style.opacity = 0, 150);
  }

  /* Blackout flash */
  if(r >= 0.25 && r < 0.4 * intensity){
    blackout.style.opacity = 1;
    setTimeout(()=> blackout.style.opacity = 0, 200);
  }

  /* Screen tear */
  if(r >= 0.4 && r < 0.6 * intensity){
    tear.style.top = Math.random()*100 + "%";
    tear.style.opacity = .7;
    setTimeout(()=> tear.style.opacity = 0, 150);
  }

  /* Violent zoom scare */
  if(r >= 0.6){
    video.style.transform = "scale(1.4)";
    setTimeout(()=> video.style.transform = "scale(1)", 150);
  }

}

/* Increase intensity over time */
setInterval(()=>{
  if(intensity < 3){
    intensity += .2;
  }
},15000);

setInterval(horrorCycle, 4000);

</script>

</body>
</html>
