<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovered Archive — 10.24.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
height:100%;
width:100%;
overflow:hidden;
background:black;
color:white;
font-family:'Share Tech Mono',monospace;
}

/* ================= BACKGROUND ================= */

video{
position:fixed;
top:0;left:0;
width:100%;height:100%;
object-fit:cover;
z-index:0;
pointer-events:none;
filter:brightness(.95) contrast(1.1);
}

.dark{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.3);
z-index:1;
pointer-events:none;
}

.scan{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 1px,
transparent 3px
);
z-index:2;
pointer-events:none;
}

/* ================= SCREEN SYSTEM ================= */

.screen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:flex;
justify-content:center;
align-items:center;
z-index:10;
opacity:0;
transition:opacity .8s ease;
pointer-events:none;
}

.screen.active{
opacity:1;
pointer-events:auto;
}

.centerText{
text-align:center;
max-width:700px;
padding:20px;
z-index:20;
}

h2{
letter-spacing:6px;
margin-bottom:25px;
font-size:22px;
}

p{
line-height:1.8;
font-size:14px;
opacity:.95;
}

button{
margin-top:20px;
padding:12px 32px;
border:2px solid white;
background:black;
color:white;
letter-spacing:4px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:black;
}

/* ================= VIDEO PANEL ================= */

.videoPanel{
position:absolute;
width:420px;
height:250px;
overflow:hidden;
border:2px solid rgba(255,255,255,.4);
box-shadow:0 0 40px rgba(0,0,0,.8);
background:black;
}

.leftPanel{left:60px;bottom:60px;}
.rightPanel{right:60px;top:60px;}

.imageLayer{
position:absolute;
width:100%;
height:100%;
z-index:1;
}

.imageLayer img{
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transform:scale(1.15);
}

.distortIn{
animation:distortEntry 1.2s forwards;
}

@keyframes distortEntry{
0%{opacity:0;transform:scale(1.6) skewX(30deg);filter:blur(20px) brightness(0);}
100%{opacity:1;transform:scale(1);filter:none;}
}

/* ================= FILM FX ================= */

.fxLayer{
position:absolute;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
mix-blend-mode:overlay;
animation:filmInstability 6s infinite linear;
}

.fxLayer::before{
content:"";
position:absolute;
width:100%;
height:100%;
background-image:url("https://grainy-gradients.vercel.app/noise.svg");
opacity:.3;
animation:grainMove 1s steps(2) infinite;
}

@keyframes grainMove{
0%{transform:translate(0,0);}
25%{transform:translate(-2%,1%);}
50%{transform:translate(1%,-2%);}
75%{transform:translate(-1%,2%);}
100%{transform:translate(0,0);}
}

@keyframes filmInstability{
0%{filter:brightness(1) contrast(1);}
15%{filter:brightness(1.1) contrast(1.25);}
35%{filter:brightness(.9) contrast(.9);}
50%{filter:brightness(1.15) contrast(1.3);}
70%{filter:brightness(.95) contrast(1.05);}
100%{filter:brightness(1) contrast(1);}
}

/* ================= DONATION STYLE ================= */

.donationBox{
border:1px solid rgba(255,255,255,.5);
padding:20px;
margin-top:25px;
animation:donationPulse 4s infinite ease-in-out;
}

@keyframes donationPulse{
0%{box-shadow:0 0 5px white;}
50%{box-shadow:0 0 20px red;}
100%{box-shadow:0 0 5px white;}
}

/* ================= SIGNAL CRASH ================= */

.crash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
z-index:999;
opacity:0;
pointer-events:none;
}

.crash.active{
animation:crashAnim 2.5s forwards;
}

@keyframes crashAnim{
0%{opacity:0;}
10%{opacity:1;}
20%{opacity:0;}
30%{opacity:1;}
40%{opacity:0;}
60%{opacity:1;}
80%{opacity:0;}
100%{opacity:0;}
}

/* ================= MOBILE ================= */

@media(max-width:900px){
.videoPanel{
position:relative;
width:90vw;
height:55vw;
margin:20px auto;
}
.leftPanel,.rightPanel{
left:auto;right:auto;top:auto;bottom:auto;
}
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrestvid.mp4" type="video/mp4">
</video>

<div class="dark"></div>
<div class="scan"></div>
<div class="crash" id="crash"></div>

<!-- CHAPTER 1 -->
<div class="screen active" id="c1">
<div class="centerText">
<h2>ARCHIVE 10.24.2026</h2>
<p>Recovered recording. Playback unstable.</p>
<button onclick="next(2)">INITIATE PLAYBACK</button>
</div>
</div>

<!-- CHAPTER 2 -->
<div class="screen" id="c2">
<div class="videoPanel leftPanel">
<div class="imageLayer"><img src="early1.jpg" id="img1"></div>
<div class="fxLayer"></div>
</div>
<div class="videoPanel rightPanel">
<div class="imageLayer"><img src="early2.jpg" id="img2"></div>
<div class="fxLayer"></div>
</div>
<div class="centerText">
<h2>RECONNECTION LOG</h2>
<p>Edit story here.</p>
<button onclick="next(3)">CONTINUE</button>
</div>
</div>

<!-- CHAPTER 3 -->
<div class="screen" id="c3">
<div class="centerText">
<h2>THE UNION</h2>
<p>October 24, 2026<br>The Conservatory — Acworth, GA</p>
<button onclick="next(4)">PROCEED</button>
</div>
</div>

<!-- CHAPTER 4 – GUEST LIST + DONATIONS -->
<div class="screen" id="c4">
<div class="centerText">
<h2>CONTRIBUTION PORTAL</h2>
<p>Enter your name into the archive.</p>

<input type="text" id="guestName" placeholder="Your Name" style="padding:10px;width:80%;margin-top:10px;">
<button onclick="saveGuest()">ENTER ARCHIVE</button>

<div class="donationBox">
<a href="https://cash.app/$YourCashtag" target="_blank">
<button>APPLE CASH</button>
</a>
<br>
<a href="mailto:yourzelleemail@example.com">
<button>ZELLE</button>
</a>
</div>

<button onclick="triggerCrash()">FINALIZE TRANSMISSION</button>

</div>
</div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<script>
const whisper=document.getElementById("whisper");
whisper.volume=.12;
let started=false;

function next(n){
if(!started){
whisper.play().catch(()=>{});
started=true;
}
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("c"+n).classList.add("active");
}

window.addEventListener("load",()=>{
setTimeout(()=>{document.getElementById("img1").classList.add("distortIn");},4000);
setTimeout(()=>{document.getElementById("img2").classList.add("distortIn");},6000);
});

/* Guest List Storage */
function saveGuest(){
let name=document.getElementById("guestName").value;
if(name){
let guests=JSON.parse(localStorage.getItem("guestList")||"[]");
guests.push(name);
localStorage.setItem("guestList",JSON.stringify(guests));
alert("NAME ARCHIVED");
}
}

/* Signal Crash */
function triggerCrash(){
document.getElementById("crash").classList.add("active");
setTimeout(()=>{
document.body.style.background="black";
},2500);
}
</script>

</body>
</html>
