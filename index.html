<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10.24.2026</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* VIDEO — CLEAN */
video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  animation:handheld 12s ease-in-out infinite;
}

/* Subtle handheld cam movement */
@keyframes handheld{
  0%{transform:scale(1.04) translate(0px,0px);}
  25%{transform:scale(1.04) translate(-4px,2px);}
  50%{transform:scale(1.04) translate(3px,-3px);}
  75%{transform:scale(1.04) translate(-2px,3px);}
  100%{transform:scale(1.04) translate(0px,0px);}
}

/* VHS grain */
.grain{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.2;
  pointer-events:none;
}

/* Scanlines */
.scanlines{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(
    rgba(255,255,255,.03) 50%, 
    rgba(0,0,0,.4) 50%
  );
  background-size:100% 3px;
  pointer-events:none;
}

/* Occasional glitch flash */
.glitch{
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
  animation:glitchFlash 18s infinite;
}

@keyframes glitchFlash{
  0%,96%,100%{opacity:0;}
  97%{opacity:.3;}
  98%{opacity:0;}
}

/* Camera shake jump scare */
.jump{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  animation:jumpScare 25s infinite;
}

@keyframes jumpScare{
  0%,94%,100%{transform:none;}
  95%{transform:translate(20px,-15px);}
  96%{transform:translate(-25px,20px);}
  97%{transform:none;}
}

/* Vignette */
.vignette{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center, transparent 70%, rgba(0,0,0,.85) 100%);
  pointer-events:none;
}

/* REC */
.rec{
  position:absolute;
  top:25px;
  left:35px;
  font-size:18px;
}

.rec span{
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

/* Timestamp */
.timestamp{
  position:absolute;
  bottom:25px;
  left:35px;
  font-size:18px;
}

/* Center Text */
.center{
  position:absolute;
  top:55%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.title{
  font-size:38px;
  letter-spacing:4px;
}

button{
  margin-top:25px;
  padding:8px 28px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:white;
  color:black;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="grain"></div>
<div class="scanlines"></div>
<div class="glitch"></div>
<div class="jump"></div>
<div class="vignette"></div>

<div class="rec"><span>●</span> REC</div>
<div class="timestamp" id="timestamp"></div>

<div class="center">
  <div class="title">YOU ARE MARKED</div>
  <button>PLAY TAPE</button>
</div>

<script>
function updateTime(){
  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  const date = pad(now.getMonth()+1)+"."+pad(now.getDate())+"."+now.getFullYear();
  const time = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  document.getElementById("timestamp").innerText = date+"  "+time;
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
