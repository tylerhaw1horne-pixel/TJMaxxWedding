<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST_TAPE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* VIDEO */
video{
position:fixed;
top:0;left:0;
width:100%;height:100%;
object-fit:cover;
z-index:0;
animation:zoom 18s infinite ease-in-out;
}

@keyframes zoom{
0%{transform:scale(1);}
50%{transform:scale(1.03);}
100%{transform:scale(1);}
}

/* SCANLINES */
body::before{
content:"";
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:linear-gradient(rgba(255,255,255,.04) 50%, rgba(0,0,0,.9) 50%);
background-size:100% 3px;
pointer-events:none;
z-index:2;
}

/* CENTERED UI */
.center{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
z-index:3;
}

button{
margin-top:20px;
padding:12px 28px;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:2px;
cursor:pointer;
}

button:hover{
background:white;
color:black;
}
</style>
</head>
<body>

<video autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="center" id="intro">
<div>SIGNAL RESTORED</div>
<button onclick="playTape()">▶ PLAY TAPE</button>
</div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<script>

/* CLEAN TRANSITION */
function staticNext(page){
const overlay=document.createElement("div");
overlay.style.position="fixed";
overlay.style.top=0;
overlay.style.left=0;
overlay.style.width="100%";
overlay.style.height="100%";
overlay.style.background="black";
overlay.style.zIndex="999";
document.body.appendChild(overlay);
setTimeout(()=>{window.location.href=page;},250);
}

function playTape(){
document.getElementById("intro").innerHTML = `
<div style="font-size:40px;margin-bottom:10px;">STAY QUIET</div>
<button onclick="staticNext('page2.html')">KEEP WALKING</button>
`;

const w=document.getElementById("whisper");
w.volume=.2;
w.play();
}

/* SUBTLE NOISE */
const canvas=document.createElement("canvas");
canvas.style.position="fixed";
canvas.style.top=0;
canvas.style.left=0;
canvas.style.width="100%";
canvas.style.height="100%";
canvas.style.pointerEvents="none";
canvas.style.zIndex="1";
canvas.style.opacity="0.08";
document.body.appendChild(canvas);

const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

function noise(){
const img=ctx.createImageData(canvas.width,canvas.height);
const buf=new Uint32Array(img.data.buffer);
for(let i=0;i<buf.length;i++){
const shade=Math.random()*255|0;
buf[i]=(255<<24)|(shade<<16)|(shade<<8)|shade;
}
ctx.putImageData(img,0,0);
requestAnimationFrame(noise);
}
noise();

</script>
</body>
</html>
