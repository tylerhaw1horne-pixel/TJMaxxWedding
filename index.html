<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovered Archive — 10.24.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
height:100%;
width:100%;
overflow:hidden;
background:black;
color:white;
font-family:'Share Tech Mono',monospace;
}

/* ================= VIDEO LAYER ================= */

.videoWrapper{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
overflow:hidden;
}

#bgVideo{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.95) contrast(1.1);
}

/* VHS rewind */
#bgVideo.rewind{
animation:rewind 1.5s linear forwards;
}

@keyframes rewind{
0%{transform:scaleX(1);}
50%{transform:scaleX(-1);}
100%{transform:scaleX(1);}
}

/* ================= ATMOSPHERE ================= */

.dark{
position:fixed;
inset:0;
background:rgba(0,0,0,.3);
z-index:1;
pointer-events:none;
}

.scan{
position:fixed;
inset:0;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 1px,
transparent 3px
);
z-index:2;
pointer-events:none;
}

/* ================= SCREEN SYSTEM ================= */

.screen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
z-index:10;
opacity:0;
transition:opacity .8s ease;
pointer-events:none;
}

.screen.active{
opacity:1;
pointer-events:auto;
}

.centerText{
text-align:center;
max-width:700px;
padding:20px;
z-index:20;
}

h2{
letter-spacing:6px;
margin-bottom:25px;
font-size:22px;
}

p{
line-height:1.8;
font-size:14px;
opacity:.95;
}

button{
margin-top:20px;
padding:12px 32px;
border:2px solid white;
background:black;
color:white;
letter-spacing:4px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:black;
}

/* ================= PHOTO PANELS ================= */

.videoPanel{
position:absolute;
width:420px;
height:250px;
overflow:hidden;
border:2px solid rgba(255,255,255,.4);
box-shadow:0 0 40px rgba(0,0,0,.8);
background:black;
}

.leftPanel{left:60px;bottom:60px;}
.rightPanel{right:60px;top:60px;}

.videoPanel img{
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transform:scale(1.1);
}

.distortIn{
animation:distortEntry 1.2s forwards;
}

@keyframes distortEntry{
0%{opacity:0;transform:scale(1.5) skewX(20deg);filter:blur(20px);}
100%{opacity:1;transform:scale(1);filter:none;}
}

.filmFX{animation:filmFX 6s infinite alternate;}
@keyframes filmFX{
0%{filter:brightness(1);}
50%{filter:brightness(1.1);}
100%{filter:brightness(.95);}
}

.rgb{animation:rgbShift 3s infinite alternate;}
@keyframes rgbShift{
0%{filter:none;}
100%{filter:drop-shadow(-2px 0 red) drop-shadow(2px 0 cyan);}
}

.tear{animation:tear .2s linear;}
@keyframes tear{
0%{transform:translateX(0);}
25%{transform:translateX(-15px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}

/* ================= DONATION ================= */

.donationBox{
border:1px solid rgba(255,255,255,.5);
padding:20px;
margin-top:25px;
animation:donationPulse 4s infinite ease-in-out;
}

@keyframes donationPulse{
0%{box-shadow:0 0 5px white;}
50%{box-shadow:0 0 25px red;}
100%{box-shadow:0 0 5px white;}
}

input{
padding:10px;
width:80%;
margin-top:10px;
background:black;
color:white;
border:1px solid white;
}

/* ================= SIGNAL CRASH ================= */

.staticCrash{
position:fixed;
inset:0;
background:repeating-linear-gradient(
0deg,
white 0px,
white 2px,
black 2px,
black 4px
);
opacity:0;
z-index:999;
pointer-events:none;
}

.staticCrash.active{
animation:signalCrash 2.5s forwards;
}

@keyframes signalCrash{
0%{opacity:0;}
10%{opacity:1;}
30%{opacity:.9;}
60%{opacity:.6;}
100%{opacity:0;}
}

.tearing .screen{
animation:pageTear .25s linear infinite;
}

@keyframes pageTear{
0%{transform:translateX(0);}
25%{transform:translateX(-20px);}
50%{transform:translateX(15px);}
75%{transform:translateX(-8px);}
100%{transform:translateX(0);}
}

</style>
</head>

<body>

<div class="videoWrapper">
<video id="bgVideo" autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>
</div>

<div class="dark"></div>
<div class="scan"></div>
<div class="staticCrash" id="staticCrash"></div>

<!-- CHAPTER 1 -->
<div class="screen active" id="c1">
<div class="centerText">
<h2>ARCHIVE 10.24.2026</h2>
<p>Recovered recording. Playback unstable.</p>
<button onclick="next(2)">INITIATE PLAYBACK</button>
</div>
</div>

<!-- CHAPTER 2 -->
<div class="screen" id="c2">
<div class="videoPanel leftPanel"><img src="early1.jpg" id="img1"></div>
<div class="videoPanel rightPanel"><img src="early2.jpg" id="img2"></div>
<div class="centerText">
<h2>RECONNECTION LOG</h2>
<p>Edit your story here.</p>
<button onclick="next(3)">CONTINUE</button>
</div>
</div>

<!-- CHAPTER 3 -->
<div class="screen" id="c3">
<div class="centerText">
<h2>THE UNION</h2>
<p>October 24, 2026<br>The Conservatory — Acworth, GA</p>
<button onclick="next(4)">PROCEED</button>
</div>
</div>

<!-- CHAPTER 4 -->
<div class="screen" id="c4">
<div class="centerText">
<h2>CONTRIBUTION PORTAL</h2>
<input type="text" id="guestName" placeholder="Your Name">
<button onclick="saveGuest()">ENTER ARCHIVE</button>

<div class="donationBox">
<a href="https://cash.app/$YourCashtag" target="_blank"><button>APPLE CASH</button></a>
<br>
<a href="mailto:yourzelleemail@example.com"><button>ZELLE</button></a>
</div>

<button onclick="triggerCrash()">FINALIZE TRANSMISSION</button>
</div>
</div>

<audio id="whisper" src="whisper.mp3" loop preload="auto"></audio>

<script>
const video=document.getElementById("bgVideo");
const whisper=document.getElementById("whisper");
const img1=document.getElementById("img1");
const img2=document.getElementById("img2");

whisper.volume=.12;

let audioStarted=false;

function startAudio(){
if(!audioStarted){
whisper.play().catch(()=>{});
audioStarted=true;
}
}

video.play().catch(()=>{});

function next(n){
startAudio();
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("c"+n).classList.add("active");
}

window.addEventListener("load",()=>{
setTimeout(()=>{img1.classList.add("distortIn","filmFX","rgb");},4000);
setTimeout(()=>{img2.classList.add("distortIn","filmFX","rgb");},6000);

setInterval(()=>{
if(Math.random()<.5){
document.querySelectorAll(".videoPanel img").forEach(img=>{
img.classList.add("tear");
setTimeout(()=>img.classList.remove("tear"),200);
});
}
},3000);
});

function saveGuest(){
let name=document.getElementById("guestName").value;
if(!name)return;
alert("NAME ARCHIVED");
}

function triggerCrash(){
startAudio();
video.classList.add("rewind");
document.body.classList.add("tearing");
setTimeout(()=>{document.getElementById("staticCrash").classList.add("active");},1200);
setTimeout(()=>{
document.body.classList.remove("tearing");
video.classList.remove("rewind");
},3000);
}
</script>

</body>
</html>
