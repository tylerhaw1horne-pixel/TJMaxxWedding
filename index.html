<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10.24.2026</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
  touch-action:none;
}

/* VIDEO */
video{
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  animation:breathing 12s ease-in-out infinite;
  transition:transform .1s, filter .1s;
}

/* Slow breathing zoom */
@keyframes breathing{
  0%{transform:scale(1.03);}
  50%{transform:scale(1.06);}
  100%{transform:scale(1.03);}
}

/* OVERLAYS */
.layer{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
}

.grain{
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.35;
}

.scanlines{
  background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.5) 50%);
  background-size:100% 3px;
}

.vignette{
  background:radial-gradient(circle at center, transparent 55%, rgba(0,0,0,.95) 100%);
}

.static{background:white;opacity:0;}
.blackout{background:black;opacity:0;}
.redFlash{background:rgba(255,0,0,.5);opacity:0;}

/* TEXT */
.glitchText{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:42px;
  letter-spacing:4px;
  opacity:0;
}

.rec{
  position:absolute;
  top:20px;
  left:25px;
  font-size:16px;
}
.rec span{
  color:red;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0;}}

.timestamp{
  position:absolute;
  bottom:20px;
  left:25px;
  font-size:14px;
}

.center{
  position:absolute;
  top:60%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.title{
  font-size:28px;
  letter-spacing:3px;
}

button{
  margin-top:20px;
  padding:8px 24px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
  font-size:14px;
}
</style>
</head>

<body>

<video id="vid" autoplay muted loop playsinline>
  <source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="layer grain"></div>
<div class="layer scanlines"></div>
<div class="layer vignette"></div>
<div class="layer static" id="static"></div>
<div class="layer blackout" id="blackout"></div>
<div class="layer redFlash" id="redFlash"></div>

<div class="glitchText" id="glitchText"></div>

<div class="rec"><span>●</span> REC</div>
<div class="timestamp" id="timestamp"></div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<div class="center">
  <div class="title">YOU ARE MARKED</div>
  <button id="nextBtn">NEXT</button>
</div>

<script>
const video = document.getElementById("vid");
const staticEl = document.getElementById("static");
const blackout = document.getElementById("blackout");
const redFlash = document.getElementById("redFlash");
const glitchText = document.getElementById("glitchText");
const whisper = document.getElementById("whisper");
const nextBtn = document.getElementById("nextBtn");
const timestampEl = document.getElementById("timestamp");

let intensity = 1;

/* Timestamp */
function updateTime(){
  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  timestampEl.innerText =
    pad(now.getMonth()+1)+"."+pad(now.getDate())+"."+now.getFullYear()+
    "  "+pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
}
setInterval(updateTime,1000);
updateTime();

/* Always-on whisper (very low) */
whisper.volume = 0.05;
document.addEventListener("click",()=>{
  whisper.play();
});

/* Next click increases horror */
nextBtn.addEventListener("click",()=>{
  whisper.volume = 0.35;
  intensity = 3;
  nextBtn.style.display="none";
});

/* Escalation */
setInterval(()=>{
  if(intensity < 5) intensity += 0.2;
},10000);

/* Horror Events */
function horrorCycle(){
  const r = Math.random();

  if(r < .25){
    staticEl.style.opacity = .5;
    setTimeout(()=>staticEl.style.opacity=0,120);
  }

  if(r < .2 * intensity){
    blackout.style.opacity = 1;
    setTimeout(()=>blackout.style.opacity=0,180);
  }

  if(r > .6){
    video.style.transform="scale(1.3)";
    setTimeout(()=>video.style.transform="scale(1.05)",150);
  }

  if(r > .8){
    redFlash.style.opacity=.6;
    setTimeout(()=>redFlash.style.opacity=0,150);
  }

  if(r > .85){
    video.pause();
    setTimeout(()=>video.play(),400);
  }

  if(r > .9){
    const messages=["DON'T MOVE","IT'S CLOSER","YOU HEARD THAT","LOOK BEHIND YOU"];
    glitchText.innerText=messages[Math.floor(Math.random()*messages.length)];
    glitchText.style.opacity=1;
    setTimeout(()=>glitchText.style.opacity=0,200);
  }
}

setInterval(horrorCycle,3000);
</script>

</body>
</html>
