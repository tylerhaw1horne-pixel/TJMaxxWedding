<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovered Archive — 10.24.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
height:100%;
width:100%;
overflow:hidden;
background:black;
color:white;
font-family:'Share Tech Mono',monospace;
}

/* FOREST VIDEO */
video{
position:fixed;
top:0;left:0;
width:100%;height:100%;
object-fit:cover;
z-index:0;
pointer-events:none;
filter:brightness(.85) contrast(1.2);
}

.dark{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.35);
z-index:1;
pointer-events:none;
}

.scan{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:linear-gradient(rgba(255,255,255,.05) 50%, rgba(0,0,0,.85) 50%);
background-size:100% 3px;
z-index:2;
pointer-events:none;
}

/* SCREEN */
.screen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:flex;
justify-content:center;
align-items:center;
z-index:100;
opacity:0;
transition:opacity .6s ease;
pointer-events:none;
}

.screen.active{
opacity:1;
pointer-events:auto;
}

.centerText{
text-align:center;
max-width:600px;
z-index:200;
}

h2{
letter-spacing:6px;
margin-bottom:25px;
}

p{
line-height:1.8;
font-size:14px;
opacity:.95;
}

button{
margin-top:30px;
padding:14px 36px;
border:2px solid white;
background:black;
color:white;
letter-spacing:4px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:black;
}

/* VIDEO PANELS */
.videoPanel{
position:absolute;
width:420px;
height:250px;
background:black;
overflow:hidden;
border:2px solid rgba(255,255,255,.35);
box-shadow:0 0 40px rgba(0,0,0,.8);
}

/* Grain */
.videoPanel::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-image:url("https://grainy-gradients.vercel.app/noise.svg");
opacity:.22;
mix-blend-mode:overlay;
pointer-events:none;
animation:grainMove 1s steps(2) infinite;
}

@keyframes grainMove{
0%{transform:translate(0,0);}
25%{transform:translate(-2%,1%);}
50%{transform:translate(1%,-2%);}
75%{transform:translate(-1%,2%);}
100%{transform:translate(0,0);}
}

/* Scanlines */
.videoPanel::after{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.04),
rgba(255,255,255,.04) 1px,
transparent 1px,
transparent 3px
);
pointer-events:none;
opacity:.6;
animation:noiseMove 1.2s infinite linear;
}

@keyframes noiseMove{
0%{transform:translateY(0);}
100%{transform:translateY(4px);}
}

.leftPanel{left:60px;bottom:60px;}
.rightPanel{right:60px;top:60px;}

.videoPanel img{
width:100%;
height:100%;
object-fit:cover;
object-position:center;
opacity:0;
transform:scale(1.2);
}

#img1{object-position:center 15%;}

/* DISTORT ENTRY */
.distortIn{
animation:distortEntry 1.4s forwards;
}

@keyframes distortEntry{
0%{
opacity:0;
transform:scale(1.6) skewX(30deg);
filter:blur(20px) brightness(0);
}
40%{
opacity:.8;
transform:scale(1.1) skewX(-8deg);
filter:blur(6px) brightness(1.6);
}
70%{
transform:scale(1.05) skewX(4deg);
filter:blur(2px) brightness(1.3);
}
100%{
opacity:1;
transform:scale(1);
filter:none;
}
}

/* STRONGER ANALOG INSTABILITY */
.videoPanel img.activeFilm{
animation:
breathing 6s infinite ease-in-out alternate,
filmInstability 6s infinite linear,
tapeWarp 8s infinite ease-in-out alternate;
}

@keyframes breathing{
0%{transform:scale(1);}
100%{transform:scale(1.04);}
}

/* More aggressive exposure/contrast variation */
@keyframes filmInstability{
0%{filter:brightness(1) contrast(1) saturate(1);}
10%{filter:brightness(1.08) contrast(1.2) saturate(1.1);}
20%{filter:brightness(.92) contrast(.9) saturate(.9);}
35%{filter:brightness(1.1) contrast(1.25) saturate(1.15);}
50%{filter:brightness(.95) contrast(1.05) saturate(1);}
65%{filter:brightness(1.07) contrast(1.15) saturate(1.1);}
80%{filter:brightness(.93) contrast(.88) saturate(.92);}
100%{filter:brightness(1) contrast(1) saturate(1);}
}

/* Subtle VHS tape bending */
@keyframes tapeWarp{
0%{transform:scale(1) skewX(0deg);}
50%{transform:scale(1.02) skewX(.6deg);}
100%{transform:scale(1) skewX(0deg);}
}

/* Glitch bursts */
.tracking{
animation:trackingBurst .35s linear;
}

@keyframes trackingBurst{
0%{transform:translateX(0);}
25%{transform:translateX(-12px);}
50%{transform:translateX(9px);}
75%{transform:translateX(-6px);}
100%{transform:translateX(0);}
}

.rgbBurst{
animation:rgbShift .3s linear;
}

@keyframes rgbShift{
0%{filter:none;}
50%{
filter:
drop-shadow(-5px 0 red)
drop-shadow(5px 0 cyan);
}
100%{filter:none;}
}

.timestamp{
position:absolute;
top:8px;
left:8px;
font-size:11px;
opacity:.9;
letter-spacing:1px;
color:white;
}

@media(max-width:900px){
.videoPanel{
position:relative;
width:90vw;
height:55vw;
margin:20px auto;
}
.leftPanel,.rightPanel{
left:auto;
right:auto;
top:auto;
bottom:auto;
}
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="dark"></div>
<div class="scan"></div>

<div class="screen active" id="c1">
<div class="centerText">
<h2>ARCHIVE 10.24.2026</h2>
<p>
Recovered from private storage.<br>
Original device unknown.<br>
Recording documents the scheduled union of two individuals.<br><br>
Playback integrity unstable.
</p>
<button onclick="next(2)">INITIATE PLAYBACK</button>
</div>
</div>

<div class="screen" id="c2">

<div class="videoPanel leftPanel">
<img src="early1.jpg" id="img1">
<div class="timestamp">REC ● JUN 22 2024</div>
</div>

<div class="videoPanel rightPanel">
<img src="early2.jpg" id="img2">
<div class="timestamp">REC ● AUG 17 2024</div>
</div>

<div class="centerText">
<h2>RECONNECTION LOG</h2>
<p>Your existing text unchanged.</p>
<button>CONTINUE</button>
</div>

</div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<script>

const whisper=document.getElementById("whisper");
whisper.volume=.12;
let started=false;

function next(n){
if(!started){
whisper.play().catch(()=>{});
started=true;
}
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("c"+n).classList.add("active");
}

window.addEventListener("load",()=>{

const img1=document.getElementById("img1");
const img2=document.getElementById("img2");

setTimeout(()=>{
img1.classList.add("distortIn");
setTimeout(()=>{
img1.classList.add("activeFilm");
},1200);
},5000);

setTimeout(()=>{
img2.classList.add("distortIn");
setTimeout(()=>{
img2.classList.add("activeFilm");
},1200);
},7000);

setInterval(()=>{
if(Math.random()<.5){
img1.classList.add("tracking");
setTimeout(()=>img1.classList.remove("tracking"),250);
}
if(Math.random()<.4){
img2.classList.add("rgbBurst");
setTimeout(()=>img2.classList.remove("rgbBurst"),250);
}
},3500);

});
</script>

</body>
</html>
