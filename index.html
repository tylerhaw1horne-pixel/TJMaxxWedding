<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovered Archive — 10.24.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
height:100%;
width:100%;
background:black;
color:white;
font-family:'Share Tech Mono',monospace;
overflow:hidden;
}

/* ================= VIDEO ================= */

.videoWrapper{
position:fixed;
inset:0;
z-index:0;
}

#bgVideo{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.8) contrast(1.1);
}

/* ================= ATMOSPHERE ================= */

.dark{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
z-index:1;
pointer-events:none;
}

.scan{
position:fixed;
inset:0;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 1px,
transparent 3px
);
z-index:2;
pointer-events:none;
}

/* ================= SCREEN ================= */

.screen{
position:fixed;
inset:0;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
z-index:10;
}

.screen.active{display:flex;}

h2{
letter-spacing:6px;
margin-bottom:20px;
font-size:22px;
}

.storyText{
max-width:700px;
line-height:1.8;
font-size:14px;
margin-bottom:25px;
}

/* ================= IMAGE LAYOUT ================= */

.imageRow{
position:absolute;
bottom:60px;
left:0;
right:0;
display:flex;
justify-content:center;
gap:40px;
}

.imagePanel{
width:280px;
height:180px;
overflow:hidden;
border:2px solid rgba(255,255,255,.4);
box-shadow:0 0 30px rgba(0,0,0,.8);
opacity:0;
transform:scale(1.1);
transition:opacity 1.2s ease, transform 6s ease;
}

.imagePanel img{
width:100%;
height:100%;
object-fit:cover;
}

.imagePanel.show{
opacity:1;
transform:scale(1);
}

/* ================= BUTTONS ================= */

button{
margin-top:20px;
padding:12px 30px;
border:2px solid white;
background:black;
color:white;
letter-spacing:4px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:black;
}

/* ================= WEDDING PARTY ================= */

.partyGrid{
display:flex;
gap:80px;
margin-top:30px;
}

.partyColumn{
min-width:200px;
text-align:left;
}

.partyColumn h3{
margin-bottom:15px;
letter-spacing:3px;
font-size:14px;
}

.partyColumn div{
margin-bottom:8px;
font-size:13px;
}

/* ================= DONATION ================= */

.donationCard{
border:2px solid rgba(255,255,255,.4);
padding:40px;
background:rgba(0,0,0,.7);
box-shadow:0 0 60px rgba(255,255,255,.08);
width:400px;
}

.donationButtons{
margin-top:25px;
display:flex;
flex-direction:column;
gap:15px;
}

/* ================= STATIC / END ================= */

.static{
position:fixed;
inset:0;
background:repeating-linear-gradient(
0deg,white 0px,white 2px,black 2px,black 4px
);
display:none;
z-index:999;
}

.whiteFlash{
position:fixed;
inset:0;
background:white;
opacity:0;
z-index:998;
pointer-events:none;
}

.whiteFlash.active{
animation:flashFX .4s ease;
}

@keyframes flashFX{
50%{opacity:.9;}
}

.screenShake{
animation:shake .2s linear infinite;
}

@keyframes shake{
25%{transform:translate(-8px,5px);}
50%{transform:translate(8px,-5px);}
}

.rewindVideo{
animation:rewindFX 1.5s ease forwards;
}

@keyframes rewindFX{
50%{transform:scaleX(-1);}
}

.ending{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:black;
font-size:24px;
letter-spacing:8px;
z-index:1000;
}

</style>
</head>

<body>

<div class="videoWrapper">
<video id="bgVideo" autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>
</div>

<div class="dark"></div>
<div class="scan"></div>
<div class="static" id="static"></div>
<div class="whiteFlash" id="whiteFlash"></div>
<div class="ending" id="ending">TRANSMISSION LOST</div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<!-- CH1 -->

<div class="screen active" id="c1">
<h2>ARCHIVE 10.24.2026</h2>
<div class="storyText">
Recovered recording. Playback unstable.
</div>
<button onclick="goTo(2)">INITIATE PLAYBACK</button>
</div>

<!-- CH2 -->

<div class="screen" id="c2">
<h2>CHAPTER TITLE</h2>
<div class="storyText">
Edit chapter text here.
</div>

<div class="imageRow">
<div class="imagePanel"><img src="c2-1.jpg"></div>
<div class="imagePanel"><img src="c2-2.jpg"></div>
<div class="imagePanel"><img src="c2-3.jpg"></div>
</div>

<button onclick="goTo(3)">CONTINUE</button>
</div>

<!-- CH5 WEDDING PARTY -->

<div class="screen" id="c5">
<h2>WEDDING PARTY</h2>

<div class="partyGrid">

<div class="partyColumn">
<h3>BRIDE'S PARTY</h3>
<div>Name — Role</div>
<div>Name — Role</div>
</div>

<div class="partyColumn">
<h3>GROOM'S PARTY</h3>
<div>Name — Role</div>
<div>Name — Role</div>
</div>

</div>

<button onclick="goTo(6)">CONTINUE</button>
</div>

<!-- CH6 DONATION -->

<div class="screen" id="c6">
<h2>CONTRIBUTION PORTAL</h2>

<div class="donationCard">
<div class="storyText">
If you wish to contribute to our future:
</div>

<div class="donationButtons">
<a href="#"><button>APPLE CASH</button></a>
<a href="#"><button>ZELLE</button></a>
</div>
</div>

<button onclick="goTo(7)">CONTINUE</button>
</div>

<script>

let whisperStarted=false;
const whisper=document.getElementById("whisper");

function startWhisper(){
if(!whisperStarted){
whisper.volume=.1;
whisper.play().catch(()=>{});
whisperStarted=true;
}
}

function goTo(n){
startWhisper();
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
const target=document.getElementById("c"+n);
target.classList.add("active");

target.querySelectorAll(".imagePanel").forEach((panel,i)=>{
setTimeout(()=>panel.classList.add("show"),i*800);
});
}

function endTransmission(){
const video=document.getElementById("bgVideo");
const flash=document.getElementById("whiteFlash");
const staticLayer=document.getElementById("static");
const ending=document.getElementById("ending");

document.body.classList.add("screenShake");
video.classList.add("rewindVideo");

setTimeout(()=>flash.classList.add("active"),600);
setTimeout(()=>{
document.body.classList.remove("screenShake");
staticLayer.style.display="block";
},1500);
setTimeout(()=>{
ending.style.display="flex";
},3000);
}

</script>

</body>
</html>
