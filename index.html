<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10.24.2026</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* LOCAL VIDEO */
video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(1) contrast(1.6) brightness(.4);
}

/* Vignette (lens darkness) */
.vignette{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center, transparent 60%, black 100%);
  pointer-events:none;
}

/* Grain */
.grain{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.6;
  pointer-events:none;
}

/* Scanlines */
.scanlines{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.6) 50%);
  background-size:100% 3px;
  pointer-events:none;
}

/* Tracking glitch */
.tracking{
  position:fixed;
  width:100%;
  height:80px;
  background:rgba(255,255,255,.15);
  top:-100px;
  animation:track 8s infinite;
}

@keyframes track{
  0%{top:-100px;}
  50%{top:100%;}
  100%{top:-100px;}
}

/* REC */
.rec{
  position:absolute;
  top:20px;
  left:30px;
  font-size:18px;
}

.rec span{
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

/* Timestamp */
.timestamp{
  position:absolute;
  bottom:20px;
  left:30px;
  font-size:18px;
}

/* Title */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  animation:flicker 5s infinite;
}

@keyframes flicker{
  0%,95%,100%{opacity:1;}
  96%{opacity:.5;}
  97%{opacity:1;}
}

.title{
  font-size:60px;
  letter-spacing:6px;
}

button{
  margin-top:40px;
  padding:10px 35px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:white;
  color:black;
}

/* Sudden tape flash */
.flash{
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
  animation:tapeFlash 10s infinite;
}

@keyframes tapeFlash{
  0%,98%,100%{opacity:0;}
  99%{opacity:.7;}
}

</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="forest.mp4" type="video/mp4">
</video>

<div class="vignette"></div>
<div class="grain"></div>
<div class="scanlines"></div>
<div class="tracking"></div>
<div class="flash"></div>

<div class="rec"><span>●</span> REC</div>
<div class="timestamp" id="timestamp"></div>

<div class="center">
  <div class="title">YOU ARE MARKED</div>
  <button>PLAY TAPE</button>
</div>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_4f8f8211e4.mp3?filename=forest-night-ambient-11015.mp3" type="audio/mpeg">
</audio>

<script>
function updateTime(){
  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  const date = pad(now.getMonth()+1)+"."+pad(now.getDate())+"."+now.getFullYear();
  const time = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  document.getElementById("timestamp").innerText = date+"  "+time;
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
