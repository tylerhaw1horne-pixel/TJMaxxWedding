<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovered Archive — 10.24.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
height:100%;
width:100%;
background:black;
color:white;
font-family:'Share Tech Mono',monospace;
overflow:hidden;
}

/* ================= VIDEO ================= */

.videoWrapper{
position:fixed;
inset:0;
z-index:0;
}

#bgVideo{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.8) contrast(1.15);
}

/* ================= ATMOSPHERE ================= */

.dark{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
z-index:1;
pointer-events:none;
}

.scan{
position:fixed;
inset:0;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 1px,
transparent 3px
);
z-index:2;
pointer-events:none;
animation:scanMove 6s linear infinite;
}

@keyframes scanMove{
0%{background-position:0 0;}
100%{background-position:0 100px;}
}

/* ================= SCREENS ================= */

.screen{
position:fixed;
inset:0;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
z-index:10;
}

.screen.active{display:flex;}

h2{
letter-spacing:6px;
margin-bottom:25px;
font-size:22px;
opacity:0;
transform:translateY(10px);
transition:all 1s ease;
}

.storyText{
max-width:700px;
line-height:1.8;
font-size:14px;
opacity:0;
transform:translateY(10px);
transition:all 1.5s ease;
margin-bottom:20px;
}

/* Cinematic text reveal */
.screen.active h2,
.screen.active .storyText{
opacity:1;
transform:translateY(0);
}

/* ================= IMAGE PANELS ================= */

.imagePanel{
position:absolute;
width:300px;
height:190px;
overflow:hidden;
border:2px solid rgba(255,255,255,.4);
box-shadow:0 0 40px rgba(0,0,0,.8);
opacity:0;
transform:scale(1.2);
transition:opacity 1.5s ease, transform 6s ease;
}

.imagePanel.left{left:60px;bottom:60px;}
.imagePanel.right{right:60px;top:60px;}
.imagePanel.center{bottom:60px;}

.imagePanel img{
width:100%;
height:100%;
object-fit:cover;
}

/* Reveal state */
.imagePanel.show{
opacity:1;
transform:scale(1);
animation:vhsPulse 5s infinite alternate;
}

/* VHS brightness pulse */
@keyframes vhsPulse{
0%{filter:brightness(1);}
50%{filter:brightness(1.08);}
100%{filter:brightness(.95);}
}

/* RGB glitch flash */
.glitchFlash{
animation:rgbSplit .3s ease;
}

@keyframes rgbSplit{
0%{filter:none;}
50%{filter:drop-shadow(-3px 0 red) drop-shadow(3px 0 cyan);}
100%{filter:none;}
}

/* Micro screen tear */
.tear{
animation:tearEffect .2s linear;
}

@keyframes tearEffect{
0%{transform:translateX(0);}
25%{transform:translateX(-15px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}

/* ================= BUTTONS ================= */

button{
margin-top:20px;
padding:12px 30px;
border:2px solid white;
background:black;
color:white;
letter-spacing:4px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:black;
}

/* ================= PARTY ================= */

.partyList{
display:none;
margin-top:15px;
line-height:1.8;
}

.partyList.show{
display:block;
animation:fadeIn .8s ease forwards;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

/* ================= CONTRIBUTION ================= */

.contributionBox{
border:2px solid rgba(255,255,255,.4);
padding:30px;
background:rgba(0,0,0,.7);
box-shadow:0 0 40px rgba(255,255,255,.1);
animation:portalGlow 6s infinite ease-in-out;
}

@keyframes portalGlow{
0%{box-shadow:0 0 20px rgba(255,255,255,.1);}
50%{box-shadow:0 0 60px rgba(255,0,0,.4);}
100%{box-shadow:0 0 20px rgba(255,255,255,.1);}
}

/* ================= FORM ================= */

input,select,textarea{
margin-top:10px;
padding:10px;
width:280px;
background:black;
color:white;
border:1px solid white;
}

textarea{height:80px;resize:none;}

/* ================= SIGNAL LOSS ================= */

.static{
position:fixed;
inset:0;
background:repeating-linear-gradient(
0deg,
white 0px,
white 2px,
black 2px,
black 4px
);
display:none;
z-index:999;
}

.ending{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:black;
font-size:24px;
letter-spacing:8px;
z-index:1000;
}
  
  /* ===== VHS REWIND CRASH ENGINE ===== */

.rewindVideo{
animation:rewindFX 1.5s ease forwards;
}

@keyframes rewindFX{
0%{transform:scaleX(1);}
50%{transform:scaleX(-1);}
100%{transform:scaleX(1);}
}

.screenShake{
animation:shake .2s linear infinite;
}

@keyframes shake{
0%{transform:translate(0,0);}
25%{transform:translate(-10px,5px);}
50%{transform:translate(10px,-5px);}
75%{transform:translate(-6px,4px);}
100%{transform:translate(0,0);}
}

.whiteFlash{
position:fixed;
inset:0;
background:white;
opacity:0;
z-index:998;
pointer-events:none;
}

.whiteFlash.active{
animation:flashFX .4s ease;
}

@keyframes flashFX{
0%{opacity:0;}
50%{opacity:.9;}
100%{opacity:0;}
}
</style>
</head>

<body>

<div class="videoWrapper">
<video id="bgVideo" autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>
</div>

<div class="dark"></div>
<div class="scan"></div>
<div class="static" id="static"></div>
<div class="whiteFlash" id="whiteFlash"></div>
<div class="ending" id="ending">TRANSMISSION LOST</div>
<audio id="whisper" src="whisper.mp3" loop></audio>

<!-- Keep your existing chapter structure unchanged here -->

<script>

let audioStarted=false;
const whisper=document.getElementById("whisper");

function startAudio(){
if(!audioStarted){
whisper.volume=.12;
whisper.play().catch(()=>{});
audioStarted=true;
}
}

function goTo(n){
startAudio();
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
const target=document.getElementById("c"+n);
target.classList.add("active");
activateImages(target);
triggerRandomGlitch();
}

function activateImages(screen){
const panels=screen.querySelectorAll(".imagePanel");
let delay=0;
panels.forEach(panel=>{
setTimeout(()=>panel.classList.add("show"),delay);
delay+=1200;
});
}

/* Random glitch engine */
function triggerRandomGlitch(){
setInterval(()=>{
if(Math.random()<.4){
document.body.classList.add("tear");
setTimeout(()=>document.body.classList.remove("tear"),200);
}
if(Math.random()<.3){
document.querySelectorAll(".imagePanel.show").forEach(p=>{
p.classList.add("glitchFlash");
setTimeout(()=>p.classList.remove("glitchFlash"),300);
});
}
},4000);
}

function toggleParty(id){
document.getElementById(id).classList.toggle("show");
}

function submitRSVP(){
const name=document.getElementById("rsvpName").value.trim();
const attendance=document.getElementById("attendance").value;
const extras=document.getElementById("extraGuests").value.trim();

if(!name||!attendance||!extras){
alert("Please complete required fields.");
return;
}

fetch("YOUR_GOOGLE_SCRIPT_URL_HERE",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name,
attendance,
extras,
message:document.getElementById("message").value,
timestamp:new Date().toISOString()
})
});

alert("RSVP ARCHIVED");
}

function endTransmission(){

const video=document.getElementById("bgVideo");
const flash=document.getElementById("whiteFlash");
const staticLayer=document.getElementById("static");
const ending=document.getElementById("ending");

/* 1️⃣ Screen shake chaos */
document.body.classList.add("screenShake");

/* 2️⃣ RGB glitch burst */
document.querySelectorAll(".imagePanel.show").forEach(p=>{
p.classList.add("glitchFlash");
});

/* 3️⃣ VHS rewind visual */
video.classList.add("rewindVideo");

/* 4️⃣ Flash burst */
setTimeout(()=>{
flash.classList.add("active");
},600);

/* 5️⃣ Static takeover */
setTimeout(()=>{
document.body.classList.remove("screenShake");
staticLayer.style.display="block";
},1500);

/* 6️⃣ Permanent signal loss */
setTimeout(()=>{
ending.style.display="flex";
},3000);
}

</script>

</body>
</html>
