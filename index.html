<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST_TAPE_01</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:black;
  color:white;
  font-family:'Share Tech Mono', monospace;
  overflow:hidden;
}
.scan{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.6) 50%);
  background-size:100% 3px;
  pointer-events:none;
}
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}
button{
  margin-top:20px;
  padding:10px 25px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
}
.hidden{opacity:0;}
.fade{transition:opacity 1s ease;}
</style>
</head>
<body>

<div class="scan"></div>
<audio id="whisper" src="whisper.mp3" loop></audio>

<div class="center" id="intro">
<div>SIGNAL RESTORED</div>
<div class="hidden fade" id="file">LOST_TAPE_01<br>10.24.2026</div>
<button class="hidden fade" id="playBtn">▶ PLAY</button>
</div>

<script>
setTimeout(()=>{document.getElementById("file").classList.remove("hidden")},2000);
setTimeout(()=>{document.getElementById("playBtn").classList.remove("hidden")},3500);

document.getElementById("playBtn").onclick=function(){
document.body.innerHTML=`
<video autoplay muted loop playsinline style="position:fixed;width:100%;height:100%;object-fit:cover;z-index:-2;filter:grayscale(100%) contrast(110%);">
<source src="forrest%20vid.mp4" type="video/mp4">
</video>
<div class="scan"></div>
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">
<div style="font-size:22px;">STAY QUIET</div>
<div style="opacity:.6;font-size:14px;">keep walking</div>
<button onclick="window.location.href='page2.html'">KEEP WALKING</button>
</div>
`;
const w=new Audio("whisper.mp3");
w.volume=0.05;
w.loop=true;
w.play();
}
</script>

</body>
</html>
