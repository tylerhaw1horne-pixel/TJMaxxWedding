<script>

const video = document.getElementById("vid");
const staticEl = document.getElementById("static");
const blackout = document.getElementById("blackout");
const redFlash = document.getElementById("redFlash");
const glitchText = document.getElementById("glitchText");
const timestampEl = document.getElementById("timestamp");

/* AUDIO SETUP */
const whisper = new Audio("whisper.mp3");
whisper.loop = true;
whisper.volume = 0;

const whisperBurst = new Audio("whisper.mp3");
whisperBurst.volume = 0.6;

/* Timestamp */
function updateTime(){
  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  const date = pad(now.getMonth()+1)+"."+pad(now.getDate())+"."+now.getFullYear();
  const time = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  timestampEl.innerText = date+"  "+time;
}
setInterval(updateTime,1000);
updateTime();

/* Start audio after user interaction */
document.addEventListener("click", ()=>{
  whisper.play();
});

/* Slow volume creep */
setInterval(()=>{
  if(whisper.volume < 0.25){
    whisper.volume += 0.01;
  }
},2000);

/* Random whisper bursts */
function whisperEvents(){

  const r = Math.random();

  /* Sudden loud whisper */
  if(r < 0.3){
    whisperBurst.currentTime = 0;
    whisperBurst.play();
  }

  /* Reverse playback */
  if(r >= 0.3 && r < 0.5){
    whisper.playbackRate = -1;
    setTimeout(()=> whisper.playbackRate = 1, 800);
  }

}

setInterval(whisperEvents, 8000);

/* Horror Visual Cycle */
let intensity = 1;

function horrorCycle(){

  const r = Math.random();

  if(r < .2 * intensity){
    staticEl.style.opacity = .5;
    setTimeout(()=> staticEl.style.opacity = 0, 150);
  }

  if(r >= .2 && r < .35 * intensity){
    blackout.style.opacity = 1;
    setTimeout(()=> blackout.style.opacity = 0, 200);
  }

  if(r >= .35 && r < .5 * intensity){
    video.pause();
    setTimeout(()=> video.play(), 400);
  }

  if(r >= .5 && r < .65 * intensity){
    video.style.transform = "scale(1.7)";
    setTimeout(()=> video.style.transform = "scale(1)", 120);
  }

  if(r >= .65){
    const messages = [
      "don't turn around",
      "he's behind you",
      "we are watching",
      "stay in the trees",
      "you shouldn't be here"
    ];
    glitchText.innerText = messages[Math.floor(Math.random()*messages.length)];
    glitchText.style.opacity = 1;
    setTimeout(()=> glitchText.style.opacity = 0, 200);
  }

}

/* Escalation */
setInterval(()=>{
  if(intensity < 4){
    intensity += .3;
  }
},15000);

setInterval(horrorCycle, 3500);

/* Mouse distortion */
document.addEventListener("mousemove", (e)=>{
  const x = (e.clientX / window.innerWidth - .5) * 10;
  const y = (e.clientY / window.innerHeight - .5) * 10;
  video.style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
});

</script>
