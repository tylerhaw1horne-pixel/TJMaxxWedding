<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 01</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* VIDEO */
video{
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  animation:breathing 10s ease-in-out infinite;
  transition:transform .1s;
}
@keyframes breathing{
  0%{transform:scale(1.03);}
  50%{transform:scale(1.06);}
  100%{transform:scale(1.03);}
}

/* OVERLAYS */
.layer{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
}

.grain{
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.4;
}

.scanlines{
  background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.6) 50%);
  background-size:100% 3px;
}

.vignette{
  background:radial-gradient(circle at center, transparent 55%, rgba(0,0,0,.95) 100%);
}

.static{
  background:white;
  opacity:0;
  transition:opacity .1s;
}

.blackout{
  background:black;
  opacity:0;
  transition:opacity .1s;
}

.signal{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  opacity:0;
  pointer-events:none;
}

.rec{
  position:absolute;
  top:20px;
  left:20px;
  font-size:16px;
}
.rec span{
  color:red;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0;}}

.timestamp{
  position:absolute;
  bottom:20px;
  left:20px;
  font-size:14px;
}

.center{
  position:absolute;
  top:60%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

button{
  margin-top:20px;
  padding:8px 24px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="layer grain"></div>
<div class="layer scanlines"></div>
<div class="layer vignette"></div>
<div class="layer static" id="static"></div>
<div class="layer blackout" id="blackout"></div>

<div class="signal" id="signal">SIGNAL LOST... RECONNECTING...</div>

<div class="rec"><span>●</span> REC</div>
<div class="timestamp" id="timestamp"></div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<div class="center">
  <button id="nextBtn">NEXT</button>
</div>

<script>
const staticEl = document.getElementById("static");
const blackout = document.getElementById("blackout");
const signal = document.getElementById("signal");
const whisper = document.getElementById("whisper");
const nextBtn = document.getElementById("nextBtn");
const timestampEl = document.getElementById("timestamp");

/* Timestamp */
function updateTime(){
  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  timestampEl.innerText =
    pad(now.getMonth()+1)+"."+pad(now.getDate())+"."+now.getFullYear()+
    "  "+pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
}
setInterval(updateTime,1000);
updateTime();

/* Whisper always low */
whisper.volume = 0.05;
document.addEventListener("click",()=>{
  whisper.play();
});

/* NEXT transition */
nextBtn.addEventListener("click",()=>{

  whisper.volume = 0.4;

  /* Massive white static blast */
  staticEl.style.opacity = 1;

  setTimeout(()=>{
    staticEl.style.opacity = 0;
    blackout.style.opacity = 1;
  },200);

  setTimeout(()=>{
    blackout.style.opacity = 0;
    signal.style.opacity = 1;
  },500);

  setTimeout(()=>{
    window.location.href="page2.html";
  },1500);

});
</script>

</body>
</html>
