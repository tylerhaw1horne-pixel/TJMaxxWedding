<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovered Archive — 10.24.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
height:100%;
width:100%;
overflow:hidden;
background:black;
color:white;
font-family:'Share Tech Mono',monospace;
}

/* ================= FOREST VIDEO ================= */

video{
position:fixed;
top:0;left:0;
width:100%;height:100%;
object-fit:cover;
z-index:0;
pointer-events:none;
filter:brightness(.95) contrast(1.1);
transition:transform 1s ease;
}

/* VHS REWIND EFFECT */
video.rewind{
animation:rewind 1.5s linear forwards;
}
@keyframes rewind{
0%{transform:scaleX(1);}
50%{transform:scaleX(-1);}
100%{transform:scaleX(1);}
}

.dark{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.3);
z-index:1;
pointer-events:none;
}

.scan{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 1px,
transparent 3px
);
z-index:2;
pointer-events:none;
}

/* ================= SCREEN SYSTEM ================= */

.screen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:flex;
justify-content:center;
align-items:center;
z-index:10;
opacity:0;
transition:opacity .8s ease;
pointer-events:none;
}

.screen.active{
opacity:1;
pointer-events:auto;
}

.centerText{
text-align:center;
max-width:700px;
padding:20px;
z-index:20;
}

h2{
letter-spacing:6px;
margin-bottom:25px;
font-size:22px;
}

p{
line-height:1.8;
font-size:14px;
opacity:.95;
}

button{
margin-top:20px;
padding:12px 32px;
border:2px solid white;
background:black;
color:white;
letter-spacing:4px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:black;
}

/* ================= PHOTO PANELS ================= */

.videoPanel{
position:absolute;
width:420px;
height:250px;
overflow:hidden;
border:2px solid rgba(255,255,255,.4);
box-shadow:0 0 40px rgba(0,0,0,.8);
background:black;
}

.leftPanel{left:60px;bottom:60px;}
.rightPanel{right:60px;top:60px;}

.videoPanel img{
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transform:scale(1.1);
}

/* Distort entry */
.distortIn{
animation:distortEntry 1.2s forwards;
}
@keyframes distortEntry{
0%{opacity:0;transform:scale(1.5) skewX(20deg);filter:blur(20px);}
100%{opacity:1;transform:scale(1);filter:none;}
}

/* Continuous film effect */
.filmFX{
animation:filmFX 6s infinite linear alternate;
}
@keyframes filmFX{
0%{filter:brightness(1) contrast(1);}
50%{filter:brightness(1.1) contrast(1.2);}
100%{filter:brightness(.95) contrast(.9);}
}

/* RGB separation */
.rgb{
animation:rgbShift 3s infinite alternate;
}
@keyframes rgbShift{
0%{filter:none;}
100%{filter:drop-shadow(-2px 0 red) drop-shadow(2px 0 cyan);}
}

/* Screen tearing */
.tear{
animation:tear 0.2s linear;
}
@keyframes tear{
0%{transform:translateX(0);}
25%{transform:translateX(-15px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}

/* ================= DONATION ================= */

.donationBox{
border:1px solid rgba(255,255,255,.5);
padding:20px;
margin-top:25px;
animation:donationPulse 4s infinite ease-in-out;
}
@keyframes donationPulse{
0%{box-shadow:0 0 5px white;}
50%{box-shadow:0 0 25px red;}
100%{box-shadow:0 0 5px white;}
}

input{
padding:10px;
width:80%;
margin-top:10px;
background:black;
color:white;
border:1px solid white;
}

/* ================= SIGNAL CRASH ================= */

.staticCrash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:repeating-linear-gradient(
0deg,
white 0px,
white 2px,
black 2px,
black 4px
);
opacity:0;
z-index:999;
pointer-events:none;
}

.staticCrash.active{
animation:signalCrash 2s forwards;
}
@keyframes signalCrash{
0%{opacity:0;}
10%{opacity:1;}
20%{opacity:0;}
40%{opacity:1;}
70%{opacity:.8;}
100%{opacity:1;}
}

@media(max-width:900px){
.videoPanel{
position:relative;
width:90vw;
height:55vw;
margin:20px auto;
}
.leftPanel,.rightPanel{left:auto;right:auto;top:auto;bottom:auto;}
}
</style>
</head>

<body>

<video id="bgVideo" autoplay muted loop playsinline>
<source src="forrestvid.mp4" type="video/mp4">
</video>

<div class="dark"></div>
<div class="scan"></div>
<div class="staticCrash" id="staticCrash"></div>

<!-- CHAPTER 1 -->
<div class="screen active" id="c1">
<div class="centerText">
<h2>ARCHIVE 10.24.2026</h2>
<p>Recovered recording. Playback unstable.</p>
<button onclick="next(2)">INITIATE PLAYBACK</button>
</div>
</div>

<!-- CHAPTER 2 -->
<div class="screen" id="c2">
<div class="videoPanel leftPanel">
<img src="early1.jpg" id="img1">
</div>
<div class="videoPanel rightPanel">
<img src="early2.jpg" id="img2">
</div>
<div class="centerText">
<h2>RECONNECTION LOG</h2>
<p>Edit story here.</p>
<button onclick="next(3)">CONTINUE</button>
</div>
</div>

<!-- CHAPTER 3 -->
<div class="screen" id="c3">
<div class="centerText">
<h2>THE UNION</h2>
<p>October 24, 2026<br>The Conservatory — Acworth, GA</p>
<button onclick="next(4)">PROCEED</button>
</div>
</div>

<!-- CHAPTER 4 -->
<div class="screen" id="c4">
<div class="centerText">
<h2>CONTRIBUTION PORTAL</h2>
<p>Enter your name into the archive.</p>
<input type="text" id="guestName" placeholder="Your Name">
<button onclick="saveGuest()">ENTER ARCHIVE</button>

<div class="donationBox">
<a href="https://cash.app/$YourCashtag" target="_blank"><button>APPLE CASH</button></a>
<br>
<a href="mailto:yourzelleemail@example.com"><button>ZELLE</button></a>
</div>

<button onclick="triggerCrash()">FINALIZE TRANSMISSION</button>
</div>
</div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<script>
const whisper=document.getElementById("whisper");
const video=document.getElementById("bgVideo");
whisper.volume=.12;
let started=false;

function next(n){
if(!started){
whisper.play().catch(()=>{});
started=true;
}
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("c"+n).classList.add("active");
}

/* Photo FX */
window.addEventListener("load",()=>{
setTimeout(()=>{
img1.classList.add("distortIn","filmFX","rgb");
},4000);
setTimeout(()=>{
img2.classList.add("distortIn","filmFX","rgb");
},6000);

setInterval(()=>{
if(Math.random()<.5){
document.querySelectorAll(".videoPanel img").forEach(img=>{
img.classList.add("tear");
setTimeout(()=>img.classList.remove("tear"),200);
});
}
},3000);
});

/* Google Sheet Logging */
function saveGuest(){
let name=document.getElementById("guestName").value;
if(!name)return;

let guests=JSON.parse(localStorage.getItem("guestList")||"[]");
guests.push(name);
localStorage.setItem("guestList",JSON.stringify(guests));

fetch("YOUR_GOOGLE_SCRIPT_URL_HERE",{
method:"POST",
body:JSON.stringify({name:name}),
headers:{"Content-Type":"application/json"}
});

alert("NAME ARCHIVED");
}

/* Rewind + Crash */
function triggerCrash(){
video.classList.add("rewind");
setTimeout(()=>{
document.getElementById("staticCrash").classList.add("active");
},1500);
}
</script>

</body>
</html>
