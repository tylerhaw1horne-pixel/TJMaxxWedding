<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST VIDEO FOUND</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:black;
color:white;
font-family:'Share Tech Mono',monospace;
overflow:hidden;
animation:cameraSway 18s infinite ease-in-out;
}

/* CAMERA SWAY */
@keyframes cameraSway{
0%{transform:rotate(0deg);}
50%{transform:rotate(0.3deg);}
100%{transform:rotate(0deg);}
}

/* VIDEO */
video{
position:fixed;
top:0;left:0;
width:100%;height:100%;
object-fit:cover;
z-index:0;
pointer-events:none;
animation:tracking 8s infinite;
}

/* TRACKING DISTORTION */
@keyframes tracking{
0%,100%{transform:translateX(0);}
10%{transform:translateX(-2px);}
20%{transform:translateX(2px);}
30%{transform:translateX(-1px);}
40%{transform:translateX(1px);}
50%{transform:translateX(0);}
}

/* VIGNETTE */
body::after{
content:"";
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:radial-gradient(circle, transparent 60%, rgba(0,0,0,.85) 100%);
pointer-events:none;
z-index:3;
}

/* SCANLINES */
body::before{
content:"";
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:linear-gradient(rgba(255,255,255,.05) 50%, rgba(0,0,0,.9) 50%);
background-size:100% 3px;
pointer-events:none;
z-index:2;
}

/* SCREEN */
.screen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
z-index:100;
opacity:0;
transition:opacity .6s;
pointer-events:none;
}
.screen.active{
opacity:1;
pointer-events:auto;
}

button{
margin-top:20px;
padding:12px 28px;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:2px;
cursor:pointer;
font-size:14px;
}

input, select{
margin-top:10px;
padding:10px;
background:black;
border:2px solid white;
color:white;
width:250px;
}

/* EFFECT LAYERS */
.flash,.red,.distort,.glitchColor,.signalTear{
position:fixed;
width:100%;height:100%;
pointer-events:none;
opacity:0;
}

.flash{background:white;z-index:10;}
.red{background:red;z-index:11;}
.distort{
background:url("https://i.imgur.com/8fK4h6N.png");
mix-blend-mode:difference;
z-index:12;
}
.glitchColor{z-index:13;}
.signalTear{height:60px;background:white;z-index:14;}
.blur{filter:blur(3px);}
</style>
</head>
<body>

<video id="bg" autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="flash" id="flash"></div>
<div class="red" id="red"></div>
<div class="distort" id="distort"></div>
<div class="glitchColor" id="glitchColor"></div>
<div class="signalTear" id="signalTear"></div>

<!-- SCREENS -->
<div class="screen active" id="s1">
<h2>LOST VIDEO FOUND</h2>
<button onclick="next(2)">▶ PLAY TAPE</button>
</div>

<div class="screen" id="s2">
<h2>STAY QUIET</h2>
<button onclick="next(3)">KEEP WALKING</button>
</div>

<div class="screen" id="s3">
<h2>THE CEREMONY HAS BEEN SCHEDULED</h2>
<button onclick="next(4)">PROCEED</button>
</div>

<div class="screen" id="s4">
<h2>OUR STORY</h2>
<p>They met before the storm. They stayed after the warning.</p>
<button onclick="next(5)">CONTINUE RECORDING</button>
</div>

<div class="screen" id="s5">
<h2>THOSE WHO STAND</h2>
<button onclick="next(6)">CONTINUE</button>
</div>

<div class="screen" id="s6">
<h2>THE RITUAL BEGINS</h2>
<p>10.24.2026 • At Dusk</p>
<button onclick="next(7)">CONTINUE</button>
</div>

<div class="screen" id="s7">
<h2>OFFERINGS TO PREVENT THE TRAGEDY</h2>
<button>VENMO</button>
<button>REGISTRY</button>
<button onclick="next(8)">CONTINUE</button>
</div>

<div class="screen" id="s8">
<h2>DIG YOUR GRAVES</h2>
<form onsubmit="submitForm(event)">
<input required placeholder="Full Name"><br>
<select required>
<option value="">Will You Attend?</option>
<option>Yes</option>
<option>No</option>
</select><br>
<button type="submit">MARK YOUR PRESENCE</button>
</form>
</div>

<div class="screen" id="s9">
<h2>YOUR PRESENCE HAS BEEN LOGGED</h2>
<p>There is no withdrawal.</p>
</div>

<audio id="whisper" src="whisper.mp3" loop></audio>

<script>
const whisper=document.getElementById("whisper");
whisper.volume=.2;

let audioStarted=false;
function startAudio(){
if(!audioStarted){
whisper.play().catch(()=>{});
audioStarted=true;
}
}

function next(n){
startAudio();
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("s"+n).classList.add("active");
}

/* AUDIO SPIKES */
setInterval(()=>{
if(Math.random()<.25){
whisper.volume=.8;
setTimeout(()=>{whisper.volume=.3;},400);
}
},6000);

/* JUMP SCARE B */
setInterval(()=>{
if(Math.random()<.15){
const bg=document.getElementById("bg");
const distort=document.getElementById("distort");
bg.pause();
distort.style.opacity=.6;
setTimeout(()=>{
distort.style.opacity=0;
bg.play();
},400);
}
},10000);

/* JUMP SCARE C */
setInterval(()=>{
if(Math.random()<.12){
const red=document.getElementById("red");
red.style.opacity=.6;
whisper.playbackRate=.6;
setTimeout(()=>{
red.style.opacity=0;
whisper.playbackRate=1;
},300);
}
},12000);

/* STATIC FLASH */
setInterval(()=>{
if(Math.random()<.2){
const flash=document.getElementById("flash");
flash.style.opacity=.8;
setTimeout(()=>{flash.style.opacity=0;},150);
}
},8000);

/* CHROMATIC GLITCH */
setInterval(()=>{
if(Math.random()<0.18){
const gc=document.getElementById("glitchColor");
gc.style.background="rgba(255,0,0,0.2)";
gc.style.opacity=.6;
setTimeout(()=>{
gc.style.background="rgba(0,0,255,0.2)";
},100);
setTimeout(()=>{
gc.style.opacity=0;
},250);
}
},7000);

/* SIGNAL TEAR */
setInterval(()=>{
if(Math.random()<0.2){
const tear=document.getElementById("signalTear");
tear.style.top=Math.random()*window.innerHeight+"px";
tear.style.opacity=.6;
setTimeout(()=>{tear.style.opacity=0;},150);
}
},6000);

/* BLUR MOMENT */
setInterval(()=>{
if(Math.random()<0.12){
document.body.classList.add("blur");
setTimeout(()=>{document.body.classList.remove("blur");},600);
}
},9000);

function submitForm(e){
e.preventDefault();
next(9);
}
</script>

</body>
</html>
