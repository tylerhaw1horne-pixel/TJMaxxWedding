<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10.24.2026</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* REAL FOREST VIDEO */
.video-bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(1) contrast(1.4) brightness(.35);
  animation:handheld 20s infinite alternate ease-in-out;
}

/* subtle handheld movement */
@keyframes handheld{
  0%{transform:scale(1.1) translate(0px,0px);}
  25%{transform:scale(1.12) translate(-20px,10px);}
  50%{transform:scale(1.15) translate(15px,-15px);}
  75%{transform:scale(1.13) translate(-10px,20px);}
  100%{transform:scale(1.1) translate(0px,0px);}
}

/* FLASHLIGHT effect */
.flashlight{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center, rgba(255,255,255,.25) 0%, rgba(0,0,0,.8) 60%);
  pointer-events:none;
  mix-blend-mode:overlay;
}

/* HEAVY GRAIN */
body::after{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://grainy-gradients.vercel.app/noise.svg");
  opacity:.6;
  pointer-events:none;
}

/* VHS scanlines */
.scanlines{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.5) 50%);
  background-size:100% 3px;
  pointer-events:none;
}

/* REC */
.rec{
  position:absolute;
  top:20px;
  left:25px;
  font-size:20px;
}

.rec span{
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

/* Timestamp */
.timestamp{
  position:absolute;
  bottom:20px;
  left:25px;
  font-size:18px;
}

/* subtle focus breathing */
@keyframes focusBreath{
  0%{filter:blur(0px);}
  50%{filter:blur(1px);}
  100%{filter:blur(0px);}
}

.video-bg{
  animation:handheld 20s infinite alternate ease-in-out, focusBreath 8s infinite;
}

/* creepy text */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  animation:flicker 6s infinite;
}

@keyframes flicker{
  0%,95%,100%{opacity:1;}
  96%{opacity:.5;}
  97%{opacity:1;}
}

.title{
  font-size:55px;
  letter-spacing:6px;
}

.enter{
  margin-top:40px;
  padding:10px 35px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
  font-size:20px;
  cursor:pointer;
  transition:.3s;
}

.enter:hover{
  background:white;
  color:black;
}

/* random tracking glitch */
.tracking{
  position:fixed;
  width:100%;
  height:80px;
  background:rgba(255,255,255,.1);
  top:-100px;
  animation:trackingMove 10s infinite;
}

@keyframes trackingMove{
  0%{top:-100px;}
  50%{top:100%;}
  100%{top:-100px;}
}

</style>
</head>

<body>

<video autoplay muted loop playsinline class="video-bg">
  <source src="https://cdn.coverr.co/videos/coverr-walking-in-dark-forest-1564/1080p.mp4" type="video/mp4">
</video>

<div class="flashlight"></div>
<div class="scanlines"></div>
<div class="tracking"></div>

<div class="rec"><span>●</span> REC</div>
<div class="timestamp">10.24.2026   19:04:12</div>

<div class="center">
  <div class="title">YOU ARE MARKED</div>
  <button class="enter">PLAY TAPE</button>
</div>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_4f8f8211e4.mp3?filename=forest-night-ambient-11015.mp3" type="audio/mpeg">
</audio>

</body>
</html>
