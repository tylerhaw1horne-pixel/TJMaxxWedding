<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FILE_CORRUPTED</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* Background video */
video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
filter:grayscale(100%) contrast(140%);
animation:frameJitter 3s infinite;
}

@keyframes frameJitter{
0%,100%{transform:translate(0,0);}
25%{transform:translate(-2px,2px);}
50%{transform:translate(2px,-2px);}
75%{transform:translate(-1px,-1px);}
}

/* overlays */
.staticOverlay{
position:fixed;
width:100%;
height:100%;
background:url("https://i.imgur.com/8fK4h6N.png");
opacity:.1;
pointer-events:none;
z-index:-1;
}

.scanlines{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.04) 50%, rgba(0,0,0,.6) 50%);
background-size:100% 3px;
pointer-events:none;
}

.vhsUI{
position:fixed;
top:10px;
left:10px;
font-size:12px;
opacity:.7;
}

.battery{
position:fixed;
top:10px;
right:10px;
font-size:12px;
opacity:.7;
}

/* Glitch text */
.glitch{
font-size:46px;
letter-spacing:4px;
animation:textGlitch 1s infinite;
}

@keyframes textGlitch{
0%{text-shadow:2px 0 red,-2px 0 blue;}
50%{text-shadow:-2px 0 red,2px 0 blue;}
100%{text-shadow:2px 0 red,-2px 0 blue;}
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:90%;
}

button{
margin-top:30px;
padding:14px 30px;
border:2px solid white;
background:transparent;
color:white;
letter-spacing:2px;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="staticOverlay"></div>
<div class="scanlines"></div>

<div class="vhsUI">REC ● 10.24.2026 21:15:32</div>
<div class="battery">BAT 71%</div>

<audio id="whisper" src="whisper.mp3" autoplay loop></audio>

<div class="center">

<div class="glitch">FILE CORRUPTED</div>

<br><br>

<div style="font-size:32px;">
TYLER HAWTHORNE<br>
&<br>
JULIE EELLS
</div>

<br>

<div style="font-size:28px;">
OCTOBER 24, 2026
</div>

<br>

<div style="opacity:.85;">
THE CONSERVATORY<br>
ACWORTH, GEORGIA
</div>

<button onclick="staticNext()">TERMINATE FILE</button>

</div>

<script>

// whisper escalation
const w=document.getElementById("whisper");
let vol=.15;
w.volume=vol;
setInterval(()=>{
if(vol<.45){vol+=.01;w.volume=vol;}
},5000);

// static transition
function staticNext(){
const static=document.createElement("div");
static.style.position="fixed";
static.style.width="100%";
static.style.height="100%";
static.style.background="black";
static.style.backgroundImage="repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0px, rgba(255,255,255,.08) 1px, transparent 1px, transparent 3px)";
static.style.zIndex="999";
document.body.appendChild(static);
setTimeout(()=>{window.location.href="page3.html";},350);
}

// random signal blackout
setInterval(()=>{
if(Math.random()<0.2){
document.body.style.filter="brightness(0)";
setTimeout(()=>{document.body.style.filter="none";},150);
}
},7000);

</script>

</body>
</html>
