<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC 02</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:black;
  overflow:hidden;
  font-family:'Share Tech Mono', monospace;
  color:white;
}

/* FULL STATIC INTRO */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  animation:flash 0.4s;
}

@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

button{
  margin-top:20px;
  padding:8px 24px;
  border:1px solid white;
  background:transparent;
  color:white;
  font-family:'Share Tech Mono', monospace;
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="whisper.mp3" type="audio/mpeg">
</audio>

<div class="center">
  <h1>YOU WERE WARNED</h1>
  <button onclick="window.location.href='page3.html'">CONTINUE</button>
</div>

</body>
</html>
