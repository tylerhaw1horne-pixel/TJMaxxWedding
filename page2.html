<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARNING</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:black;color:white;font-family:'Share Tech Mono',monospace;overflow:hidden;}

video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;animation:zoom 16s infinite ease-in-out;}

@keyframes zoom{0%{transform:scale(1);}50%{transform:scale(1.04);}100%{transform:scale(1);}}

body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(255,255,255,.04) 50%,rgba(0,0,0,.9) 50%);background-size:100% 3px;pointer-events:none;z-index:2;}

.center{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:3;}

button{margin-top:20px;padding:12px 28px;border:2px solid white;background:transparent;color:white;letter-spacing:2px;}
</style>
</head>
<body>

<video autoplay muted loop playsinline>
<source src="forrest vid.mp4" type="video/mp4">
</video>

<div class="center">
<h1 style="font-size:38px;">WARNING: SENSITIVE INFORMATION</h1>
<button onclick="staticNext('page3.html')">PROCEED ANYWAY</button>
</div>

<audio src="whisper.mp3" autoplay loop volume="0.3"></audio>

<script>
function staticNext(page){
const o=document.createElement("div");
o.style.position="fixed";
o.style.top=0;o.style.left=0;
o.style.width="100%";o.style.height="100%";
o.style.background="black";
o.style.zIndex="999";
document.body.appendChild(o);
setTimeout(()=>{window.location.href=page;},250);
}
</script>
</body>
</html>
