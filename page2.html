<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FILE_CORRUPTED</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:black;
color:white;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:grayscale(100%) contrast(120%);
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
z-index:-1;
}

.scan{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(rgba(255,255,255,.03) 50%, rgba(0,0,0,.6) 50%);
background-size:100% 3px;
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:90%;
}

.glitchText{
font-size:40px;
letter-spacing:4px;
animation:glitch 1.5s infinite;
}

@keyframes glitch{
0%{text-shadow:2px 0 red,-2px 0 blue;}
50%{text-shadow:-2px 0 red,2px 0 blue;}
100%{text-shadow:2px 0 red,-2px 0 blue;}
}

button{
margin-top:30px;
padding:12px 30px;
border:2px solid white;
background:transparent;
color:white;
font-size:16px;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="forrest%20vid.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<div class="scan"></div>

<audio id="w" src="whisper.mp3" autoplay loop></audio>

<div class="center">

<div class="glitchText">FILE CORRUPTED</div>
<br><br>

<div style="font-size:28px;">
TYLER HAWTHORNE<br>
&<br>
JULIE EELLS
</div>

<br>

<div style="font-size:24px;">
OCTOBER 24, 2026
</div>

<br>

<div style="opacity:.8;">
THE CONSERVATORY<br>
ACWORTH, GEORGIA
</div>

<button onclick="next()">TERMINATE FILE</button>

</div>

<script>
document.getElementById("w").volume=.18;

function next(){
document.body.insertAdjacentHTML("beforeend","<div style='position:fixed;width:100%;height:100%;background:white;animation:fade .4s forwards;'></div>");
setTimeout(()=>{window.location.href='page3.html';},350);
}
</script>

</body>
</html>
